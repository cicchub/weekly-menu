<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://api.github.com; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>Weekly Menu</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Weekly Menu">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#F1EBE6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1E1614" media="(prefers-color-scheme: dark)">
<style>
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none !important}
:root{
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
  /* palette */
  --c1:#F7F2EE; --c2:#E8DED5; --c3:#D6C8BD; --c4:#C5B7AA; --c5:#B9A99A; --c6:#A89584;
  --c7:#947A69; --c8:#796655; --c9:#6A5446; --c10:#59473B; --c11:#47362E; --c12:#2F211E;
  /* tema chiaro */
  --bg:#F1EBE6; --card:#FFFCFA; --text:var(--c12); --text2:var(--c8); --sep:rgba(47,33,30,.10);
  --pri:var(--c10); --pri-ink:var(--c1); --pri-soft:rgba(106,84,70,.13);
  --fill:rgba(47,33,30,.06); --fill2:rgba(47,33,30,.12);
  --bar:var(--c9); --over:#A3502F; --over-soft:rgba(163,80,47,.12);
  --glass:rgba(241,235,230,.74); --glass-line:rgba(255,255,255,.75); --glass-shadow:0 12px 32px rgba(47,33,30,.18);
  /* scala per gli spaccati, dal più scuro al più chiaro */
  --r0:#2F211E; --r1:#47362E; --r2:#59473B; --r3:#6A5446; --r4:#796655; --r5:#947A69; --r6:#A89584; --r7:#B9A99A; --r8:#C5B7AA; --r9:#D6C8BD;
  --blur:blur(24px) saturate(160%);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#1E1614; --card:#2F211E; --text:#F7F2EE; --text2:#B9A99A; --sep:rgba(247,242,238,.10);
    --pri:#D6C8BD; --pri-ink:#2F211E; --pri-soft:rgba(214,200,189,.16);
    --fill:rgba(247,242,238,.07); --fill2:rgba(247,242,238,.15);
    --bar:#D6C8BD; --over:#E39A7B; --over-soft:rgba(227,154,123,.16);
    --glass:rgba(30,22,20,.72); --glass-line:rgba(255,255,255,.10); --glass-shadow:0 12px 32px rgba(0,0,0,.5);
    --r0:#F7F2EE; --r1:#E8DED5; --r2:#D6C8BD; --r3:#C5B7AA; --r4:#B9A99A; --r5:#A89584; --r6:#947A69; --r7:#796655; --r8:#6A5446; --r9:#59473B;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#1E1614; --card:#2F211E; --text:#F7F2EE; --text2:#B9A99A; --sep:rgba(247,242,238,.10);
  --pri:#D6C8BD; --pri-ink:#2F211E; --pri-soft:rgba(214,200,189,.16);
  --fill:rgba(247,242,238,.07); --fill2:rgba(247,242,238,.15);
  --bar:#D6C8BD; --over:#E39A7B; --over-soft:rgba(227,154,123,.16);
  --glass:rgba(30,22,20,.72); --glass-line:rgba(255,255,255,.10); --glass-shadow:0 12px 32px rgba(0,0,0,.5);
  --r0:#F7F2EE; --r1:#E8DED5; --r2:#D6C8BD; --r3:#C5B7AA; --r4:#B9A99A; --r5:#A89584; --r6:#947A69; --r7:#796655; --r8:#6A5446; --r9:#59473B;
}

html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font:400 17px/1.3 ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:11;background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
h1,h2,h3,p,ul{margin:0}
ul{padding:0;list-style:none}
button,input{font-family:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent;color:inherit}
:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
main{max-width:560px;margin:0 auto;padding:6px 16px 156px}
.emo{line-height:1}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:8px}
.top h1{font-size:34px;font-weight:800;letter-spacing:-0.02em;line-height:1.1}
.top p{margin-top:2px;color:var(--text2);font-size:15px}

/* settimana in una riga */
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:14px}
.sd{display:grid;justify-items:center;gap:4px;padding:6px 0 8px;border:0;border-radius:16px;background:none;font-size:12px;font-weight:700;color:var(--text2)}
.sd__n{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;border:2px solid var(--fill2);color:var(--text);font-size:15px;font-weight:800}
.sd.perfect .sd__n{border-color:var(--pri);background:var(--pri);color:var(--pri-ink)}
.sd.partial .sd__n{border-color:var(--pri)}
.sd[aria-pressed="true"]{background:var(--card);color:var(--text)}

/* attività della giornata */
.actc{display:grid;grid-template-columns:auto minmax(0,1fr) 18px;align-items:center;gap:12px;width:100%;margin-top:12px;padding:12px 14px;border:0;border-radius:22px;background:var(--card);text-align:left;font-size:17px}
.actc__ico{display:flex}
.actc__ico span{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:var(--pri-soft);font-size:21px;line-height:1;box-shadow:0 0 0 3px var(--card)}
.actc__ico span + span{margin-left:-12px}
.actc b{display:block;font-weight:800;overflow-wrap:anywhere}
.actc small{display:block;margin-top:2px;color:var(--text2);font-size:14px}
.actc > svg{width:18px;height:18px;color:var(--text2)}

/* riepilogo */
.hero{margin-top:12px;padding:16px 16px 14px;border-radius:26px;background:var(--card)}
.gauge{position:relative;max-width:260px;margin:0 auto}
.gauge svg{display:block;width:100%}
.g-bg,.g-fg{fill:none;stroke-width:16;stroke-linecap:round}
.g-bg{stroke:var(--fill2)}
.g-fg{stroke:var(--pri);transition:stroke-dasharray .35s ease,stroke .2s}
.gauge.over .g-fg{stroke:var(--over)}
.gauge__mid{position:absolute;left:0;right:0;bottom:0;text-align:center}
.gauge__n{font-size:44px;font-weight:800;letter-spacing:-0.02em;line-height:1}
.gauge__l{margin-top:2px;color:var(--text2);font-size:14px;font-weight:600}
.hero__row{display:flex;justify-content:space-between;gap:12px;margin-top:12px;color:var(--text2);font-size:14px}
.hero__row b{display:block;color:var(--text);font-size:17px;font-weight:800}
.hero__row div:last-child{text-align:right}
.state{display:flex;align-items:center;justify-content:center;gap:6px;min-height:36px;margin-top:12px;border-radius:999px;background:var(--fill);color:var(--text2);font-size:15px;font-weight:700}
.state.win{background:var(--pri-soft);color:var(--pri)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:2px;margin-top:12px;padding:3px;border-radius:14px;background:var(--fill)}
.seg button{min-height:36px;border:0;border-radius:11px;background:transparent;font-size:15px;font-weight:700}
.seg button[aria-checked="true"]{background:var(--card);box-shadow:0 1px 4px rgba(47,33,30,.16)}
.seg--sm{margin-top:8px}
.seg--sm button{min-height:34px;padding:0 2px;font-size:14px}

/* riga dei macro: resta in alto mentre scorri, e si tocca per lo spaccato */
.macro{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;margin:10px -16px 0;padding:7px 16px 8px;background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border-bottom:1px solid var(--sep)}
.mrow{display:grid;grid-template-columns:1.15fr repeat(4,1fr) 14px;gap:8px;align-items:center;max-width:528px;margin:0 auto}
.mc{display:block;min-width:0;padding:3px 0;border:0;border-radius:10px;background:none;text-align:left}
.mc__k{display:block;color:var(--text2);font-size:12px;font-weight:700}
.mc__v{display:block;font-size:15px;font-weight:800;white-space:nowrap}
.mc__v small{color:var(--text2);font-size:12px;font-weight:600}
.mc__b{display:block;height:5px;margin-top:4px;border-radius:3px;background:var(--fill2);overflow:hidden}
.mc__b i{display:block;height:100%;width:0;border-radius:3px;background:var(--bar);transition:width .3s ease}
.mc__b i.over{background:var(--over)}
.mrow > svg{width:14px;height:14px;color:var(--text2)}

/* pasti */
.meal{margin-top:14px;padding:6px 14px 8px;border-radius:22px;background:var(--card)}
.meal__head{display:grid;grid-template-columns:minmax(0,1fr) 40px 44px;align-items:center;gap:8px;min-height:60px}
.meal__open{display:grid;grid-template-columns:44px minmax(0,1fr);align-items:center;gap:10px;min-height:56px;padding:0;border:0;border-radius:14px;background:none;text-align:left;font-size:17px}
.meal__name{display:block;font-size:18px;font-weight:800;line-height:1.15;overflow-wrap:anywhere}
.meal__sum{display:block;color:var(--text2);font-size:14px}
.check{display:grid;place-items:center;width:40px;height:40px;padding:0;border:2px solid var(--fill2);border-radius:50%;background:none;color:var(--text2)}
.check svg{width:18px;height:18px;opacity:.45}
.check[aria-pressed="true"]{border-color:var(--pri);background:var(--pri);color:var(--pri-ink)}
.check[aria-pressed="true"] svg{opacity:1}
.meal.eaten .ico{background:var(--pri-soft)}
.ico{display:grid;place-items:center;width:44px;height:44px;border-radius:14px;background:var(--fill);font-size:24px;line-height:1}
.plus{width:44px;height:44px;border:0;border-radius:50%;background:var(--pri);color:var(--pri-ink);display:grid;place-items:center}
.plus svg{width:20px;height:20px}
.food{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:8px;min-height:58px;border-top:1px solid var(--sep)}
.food__main{display:grid;grid-template-columns:36px minmax(0,1fr);align-items:center;gap:10px;min-height:56px;padding:0;border:0;background:none;text-align:left;font-size:17px}
.food__main .emo{font-size:26px;text-align:center}
.food__main b{display:block;font-weight:700;overflow-wrap:anywhere}
.food__main small{display:block;color:var(--text2);font-size:13px}
.qty{display:inline-grid;grid-template-columns:34px auto 34px;align-items:center;border-radius:999px;background:var(--fill)}
.qty button{height:38px;border:0;background:none;font-size:15px;font-weight:800}
.qty button svg{width:14px;height:14px;display:block;margin:0 auto}
.qty__v{min-width:52px;padding:0 2px}
.empty{padding:10px 0 6px;border-top:1px solid var(--sep);color:var(--text2);font-size:15px}

/* consigli e pulsanti */
.sect{margin-top:22px}
.sect__head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:0 4px 8px}
.sect__head h2{font-size:20px;font-weight:800}
.card{border-radius:22px;background:var(--card);padding:4px 14px}
.card > :last-child{border-bottom:0}
.coach{padding:14px}
.coach__msg{font-weight:700}
.coach__sub{margin-top:6px;color:var(--text2);font-size:15px}
.coach__after{margin-top:12px;padding:10px 12px;border-radius:14px;background:var(--fill);font-size:15px}
.coach__foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px;padding-top:6px;border-top:1px solid var(--sep);color:var(--text2);font-size:13px}
.sugg{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:10px;margin-top:10px;padding-top:10px;border-top:1px solid var(--sep)}
.sugg b{display:block;font-weight:700}
.sugg small{display:block;margin-top:2px;color:var(--text2);font-size:14px}
.sugg.done{opacity:.6}
.pill{min-height:38px;padding:0 16px;border:0;border-radius:999px;background:var(--pri);color:var(--pri-ink);font-size:15px;font-weight:700}
.pill[disabled]{background:var(--fill);color:var(--text2);cursor:default}
.pill--soft{background:var(--pri-soft);color:var(--pri)}
.pill--plain{background:var(--fill);color:var(--text)}
.pill--wide{width:100%;min-height:48px;font-size:17px}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.lead{margin-top:10px;padding:0 4px;color:var(--text2);font-size:15px}
.textbtn{min-height:44px;padding:0 4px;border:0;background:none;color:var(--pri);font-size:17px;font-weight:800}
.textbtn--sm{min-height:34px;font-size:14px}

/* pulsante che compare quando cambi la giornata */
.fab{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));z-index:19;transform:translateX(-50%);display:inline-flex;align-items:center;gap:8px;min-height:46px;padding:0 20px;border:0;border-radius:999px;background:var(--pri);color:var(--pri-ink);font-size:16px;font-weight:800;white-space:nowrap;box-shadow:var(--glass-shadow)}

/* genera */
.gen{display:grid;justify-items:center;gap:10px;padding:28px 20px 24px;text-align:center}
.gen__img{width:88px;height:88px;border-radius:22px;box-shadow:0 6px 18px rgba(47,33,30,.2)}
.gen h2{margin-top:4px;font-size:22px;font-weight:800}
.gen p{max-width:34ch;color:var(--text2);font-size:16px}
.tag{display:inline-block;margin-top:4px;padding:4px 12px;border-radius:999px;background:var(--fill);color:var(--text2);font-size:13px;font-weight:800}

/* settimana */
.day{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:2px 10px;align-items:center;width:100%;min-height:74px;padding:10px 0;border:0;border-bottom:1px solid var(--sep);background:none;font-size:17px;text-align:left}
.day .ico{grid-row:1 / span 2}
.day__name{font-weight:800}
.day__type{color:var(--text2);font-size:14px;font-weight:700}
.day__prev{grid-column:2 / -1;color:var(--text2);font-size:14px}
.day__kcal{text-align:right;font-size:13px;color:var(--text2)}
.day__kcal b{display:block;color:var(--text);font-size:16px}
.buy{display:grid;grid-template-columns:28px 30px minmax(0,1fr) auto;align-items:center;gap:8px;min-height:52px;border-bottom:1px solid var(--sep)}
.buy input{width:22px;height:22px;accent-color:var(--pri)}
.buy .emo{font-size:22px}
.buy span:last-child{color:var(--text2)}
.buy:has(input:checked) span:not(.emo){text-decoration:line-through;color:var(--text2)}

/* spaccati */
.bo-list{padding:4px 6px}
.bo{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:baseline;gap:6px 10px;width:100%;padding:10px 8px;border:0;border-radius:14px;background:none;text-align:left;font-size:16px}
.bo[aria-pressed="true"]{background:var(--fill)}
.bo__k{font-weight:800}
.bo__v{font-weight:800;white-space:nowrap}
.bo__v small{color:var(--text2);font-size:13px;font-weight:600}
.stack{grid-column:1 / -1;position:relative;display:flex;height:12px;border-radius:6px;background:var(--fill);overflow:hidden}
.stack i{display:block;height:100%;border-right:2px solid var(--card)}
.stack__tgt{position:absolute;top:0;bottom:0;width:3px;margin-left:-1.5px;border-radius:2px;background:var(--text)}
.br{display:grid;grid-template-columns:10px 28px minmax(0,1fr) auto;align-items:center;gap:6px 10px;width:100%;padding:10px 0;border:0;border-bottom:1px solid var(--sep);background:none;text-align:left;font-size:16px}
.br__dot{width:10px;height:10px;border-radius:50%}
.br .emo{font-size:22px;text-align:center}
.br__n{min-width:0}
.br__n b{display:block;font-weight:700;overflow-wrap:anywhere}
.br__n small,.br__v small{display:block;color:var(--text2);font-size:13px}
.br__v{text-align:right;white-space:nowrap}
.br__v b{font-weight:800}
.br__bar{grid-column:3 / -1;height:6px;border-radius:3px;background:var(--fill);overflow:hidden}
.br__bar i{display:block;height:100%;border-radius:3px}

/* dock a vetro */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;padding:0 14px calc(10px + env(safe-area-inset-bottom,0px));pointer-events:none}
.dock__in{pointer-events:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:2px;width:100%;max-width:330px;padding:6px;border-radius:34px;background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--glass-line);box-shadow:var(--glass-shadow)}
.dock a{display:grid;justify-items:center;align-content:center;gap:2px;min-height:56px;padding:6px 2px;border-radius:28px;color:var(--text2);font-size:11px;font-weight:700;text-decoration:none}
.dock a svg{width:24px;height:24px}
.dock a[aria-current="page"]{background:var(--pri-soft);color:var(--pri)}
.dock a.mid span{display:grid;place-items:center;width:46px;height:28px;border-radius:14px;background:var(--pri);color:var(--pri-ink)}
.dock a.mid svg{width:19px;height:19px}

/* pannello dal basso */
dialog.sheet{position:fixed;inset:auto 0 0 0;width:100%;max-width:560px;max-height:88%;margin:0 auto;padding:0;border:0;border-radius:26px 26px 0 0;background:var(--bg);color:var(--text);overflow:auto;overscroll-behavior:contain}
dialog.sheet:not([open]){display:none}
dialog::backdrop{background:rgba(30,22,20,.45)}
.sheet__head{position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px 10px;background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
.sheet__head h2{font-size:20px;font-weight:800}
.sheet__head h2:focus{outline:none}
.sheet__body{padding:6px 16px calc(26px + env(safe-area-inset-bottom,0px))}
.field{display:block;width:100%;height:52px;padding:0 16px;border:2px solid transparent;border-radius:16px;background:var(--card);color:var(--text);font-size:17px;-webkit-appearance:none;appearance:none}
.field:focus{border-color:var(--pri);outline:none}
.field::placeholder{color:var(--text2)}
.hint{margin-top:8px;padding:0 4px;color:var(--text2);font-size:14px}
.sub{margin:18px 4px 8px;font-size:15px;font-weight:800;color:var(--text2)}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.quick--3{grid-template-columns:repeat(3,1fr);margin-top:12px}
.quick button{display:grid;justify-items:center;gap:4px;min-height:76px;padding:10px 4px 8px;border:2px solid transparent;border-radius:18px;background:var(--card);font-size:12px;font-weight:700;line-height:1.15;text-align:center}
.quick button .emo{font-size:28px}
.quick button.on{border-color:var(--pri);background:var(--pri-soft)}
.acts-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.acts-grid button{display:grid;justify-items:center;align-content:center;gap:6px;min-height:84px;padding:10px 4px;border:2px solid transparent;border-radius:18px;background:var(--card);font-size:13px;font-weight:700;line-height:1.15;text-align:center}
.acts-grid button .emo{font-size:30px}
.acts-grid button[aria-pressed="true"]{border-color:var(--pri);background:var(--pri-soft)}
.dur{padding:10px 0;border-bottom:1px solid var(--sep)}
.dur__n{display:flex;align-items:center;gap:8px;font-weight:700}
.pick{display:grid;grid-template-columns:36px minmax(0,1fr) auto;align-items:center;gap:10px;width:100%;min-height:56px;border:0;border-bottom:1px solid var(--sep);background:none;font-size:17px;text-align:left}
.pick .emo{font-size:24px;text-align:center}
.pick small{display:block;color:var(--text2);font-size:13px}
.pick > span:last-child{color:var(--pri);font-size:14px;font-weight:800}
.amount{display:grid;grid-template-columns:56px 1fr 56px;align-items:center;gap:10px;margin-top:8px}
.amount button{width:56px;height:56px;border:0;border-radius:50%;background:var(--card);display:grid;place-items:center}
.amount button svg{width:22px;height:22px}
.amount__n{text-align:center;font-size:44px;font-weight:800;letter-spacing:-0.02em;line-height:1}
.amount__n small{font-size:20px;color:var(--text2)}
input[type="range"]{width:100%;margin:16px 0 4px;accent-color:var(--pri)}
.impact{margin-top:12px;padding:12px 14px;border-radius:16px;background:var(--card);font-size:15px}
.impact b{font-weight:800}

/* stato del salvataggio, impostazioni, conflitti */
.top__l{min-width:0}
.top__r{display:flex;align-items:center;gap:8px;flex:none}
.sync{display:inline-flex;align-items:center;gap:6px;max-width:172px;min-height:36px;padding:0 12px;border:0;border-radius:999px;background:var(--card);color:var(--text2);font-size:13px;font-weight:800;white-space:nowrap}
.sync__t{overflow:hidden;text-overflow:ellipsis}
.sync--salvato .sync__i{color:var(--pri)}
.sync--errore,.sync--conflitti,.sync--scelta,.sync--aggiorna{background:var(--over-soft);color:var(--over)}
.round{display:grid;place-items:center;flex:none;width:40px;height:40px;border:0;border-radius:50%;background:var(--card);color:var(--text)}
.round svg{width:20px;height:20px}
.info{padding:12px 14px}
.info__t{font-weight:800}
.info .acts{margin-top:10px}
.conf{padding:12px 0;border-bottom:1px solid var(--sep)}
.conf b{display:block;font-weight:800}
.conf__v{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.conf__v .pill{display:grid;align-content:center;gap:2px;min-height:58px;padding:6px 12px;border-radius:16px;text-align:left;font-size:14px}
.conf__v .pill small{color:var(--text2);font-size:12px;font-weight:700}
details.aiuto{margin-top:14px;padding:12px 14px;border-radius:16px;background:var(--card)}
details.aiuto summary{font-weight:800;cursor:pointer}
details.aiuto ol{margin:8px 0 0;padding-left:20px;color:var(--text2);font-size:15px}
details.aiuto li{margin-top:6px}
.field:disabled{opacity:.6}
.avviso{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));z-index:30;transform:translateX(-50%);width:max-content;max-width:calc(100% - 32px);padding:10px 16px;border-radius:16px;background:var(--text);color:var(--bg);font-size:15px;font-weight:700;box-shadow:var(--glass-shadow)}

@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}
</style>
</head>
<body>

<main id="main"><div id="view"></div></main>

<div class="avviso" id="avviso" role="status" hidden></div>

<button type="button" class="fab" id="fab" hidden>✨ Analizza la giornata</button>

<nav class="dock" aria-label="Sezioni">
  <div class="dock__in">
    <a href="#oggi" data-tab="oggi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 13a8 8 0 0 1 16 0"/><path d="M3 17h18M12 13l3.5-3.5"/></svg>Giornata</a>
    <a href="#genera" data-tab="genera" class="mid"><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 3.5l1.9 5.1 5.1 1.9-5.1 1.9L11 17.5l-1.9-5.1L4 10.5l5.1-1.9z"/><path d="M18.5 15l.8 2.2 2.2.8-2.2.8-.8 2.2-.8-2.2-2.2-.8 2.2-.8z"/></svg></span>Genera</a>
    <a href="#settimana" data-tab="settimana"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="3.5"/><path d="M4 10h16M8.5 3v4M15.5 3v4"/></svg>Settimana</a>
  </div>
</nav>

<dialog class="sheet" id="sheet" aria-labelledby="sheetTitle">
  <div class="sheet__head"><h2 id="sheetTitle" tabindex="-1"></h2><button type="button" class="textbtn" id="sheetClose">Fine</button></div>
  <div class="sheet__body" id="sheetBody"></div>
</dialog>

<script src="archivio.js"></script>
<script src="app.js"></script>
</body>
</html>
