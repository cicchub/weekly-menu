<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Weekly Menu</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Weekly Menu">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#F1EBE6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1E1614" media="(prefers-color-scheme: dark)">
<style>
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none !important}
:root{
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
  /* palette */
  --c1:#F7F2EE; --c2:#E8DED5; --c3:#D6C8BD; --c4:#C5B7AA; --c5:#B9A99A; --c6:#A89584;
  --c7:#947A69; --c8:#796655; --c9:#6A5446; --c10:#59473B; --c11:#47362E; --c12:#2F211E;
  /* tema chiaro */
  --bg:#F1EBE6; --card:#FFFCFA; --text:var(--c12); --text2:var(--c8); --sep:rgba(47,33,30,.10);
  --pri:var(--c10); --pri-ink:var(--c1); --pri-soft:rgba(106,84,70,.13);
  --fill:rgba(47,33,30,.06); --fill2:rgba(47,33,30,.12);
  --bar:var(--c9); --over:#A3502F;
  --glass:rgba(241,235,230,.74); --glass-line:rgba(255,255,255,.75); --glass-shadow:0 12px 32px rgba(47,33,30,.18);
  /* scala per gli spaccati, dal più scuro al più chiaro */
  --r0:#2F211E; --r1:#47362E; --r2:#59473B; --r3:#6A5446; --r4:#796655; --r5:#947A69; --r6:#A89584; --r7:#B9A99A; --r8:#C5B7AA; --r9:#D6C8BD;
  --blur:blur(24px) saturate(160%);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#1E1614; --card:#2F211E; --text:#F7F2EE; --text2:#B9A99A; --sep:rgba(247,242,238,.10);
    --pri:#D6C8BD; --pri-ink:#2F211E; --pri-soft:rgba(214,200,189,.16);
    --fill:rgba(247,242,238,.07); --fill2:rgba(247,242,238,.15);
    --bar:#D6C8BD; --over:#E39A7B;
    --glass:rgba(30,22,20,.72); --glass-line:rgba(255,255,255,.10); --glass-shadow:0 12px 32px rgba(0,0,0,.5);
    --r0:#F7F2EE; --r1:#E8DED5; --r2:#D6C8BD; --r3:#C5B7AA; --r4:#B9A99A; --r5:#A89584; --r6:#947A69; --r7:#796655; --r8:#6A5446; --r9:#59473B;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#1E1614; --card:#2F211E; --text:#F7F2EE; --text2:#B9A99A; --sep:rgba(247,242,238,.10);
  --pri:#D6C8BD; --pri-ink:#2F211E; --pri-soft:rgba(214,200,189,.16);
  --fill:rgba(247,242,238,.07); --fill2:rgba(247,242,238,.15);
  --bar:#D6C8BD; --over:#E39A7B;
  --glass:rgba(30,22,20,.72); --glass-line:rgba(255,255,255,.10); --glass-shadow:0 12px 32px rgba(0,0,0,.5);
  --r0:#F7F2EE; --r1:#E8DED5; --r2:#D6C8BD; --r3:#C5B7AA; --r4:#B9A99A; --r5:#A89584; --r6:#947A69; --r7:#796655; --r8:#6A5446; --r9:#59473B;
}

html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font:400 17px/1.3 ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:11;background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
h1,h2,h3,p,ul{margin:0}
ul{padding:0;list-style:none}
button,input{font-family:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent;color:inherit}
:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
main{max-width:560px;margin:0 auto;padding:6px 16px 156px}
.emo{line-height:1}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:8px}
.top h1{font-size:34px;font-weight:800;letter-spacing:-0.02em;line-height:1.1}
.top p{margin-top:2px;color:var(--text2);font-size:15px}

/* settimana in una riga */
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:14px}
.sd{display:grid;justify-items:center;gap:4px;padding:6px 0 8px;border:0;border-radius:16px;background:none;font-size:12px;font-weight:700;color:var(--text2)}
.sd__n{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;border:2px solid var(--fill2);color:var(--text);font-size:15px;font-weight:800}
.sd.perfect .sd__n{border-color:var(--pri);background:var(--pri);color:var(--pri-ink)}
.sd.partial .sd__n{border-color:var(--pri)}
.sd[aria-pressed="true"]{background:var(--card);color:var(--text)}

/* attività della giornata */
.actc{display:grid;grid-template-columns:auto minmax(0,1fr) 18px;align-items:center;gap:12px;width:100%;margin-top:12px;padding:12px 14px;border:0;border-radius:22px;background:var(--card);text-align:left;font-size:17px}
.actc__ico{display:flex}
.actc__ico span{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:var(--pri-soft);font-size:21px;line-height:1;box-shadow:0 0 0 3px var(--card)}
.actc__ico span + span{margin-left:-12px}
.actc b{display:block;font-weight:800;overflow-wrap:anywhere}
.actc small{display:block;margin-top:2px;color:var(--text2);font-size:14px}
.actc > svg{width:18px;height:18px;color:var(--text2)}

/* riepilogo */
.hero{margin-top:12px;padding:16px 16px 14px;border-radius:26px;background:var(--card)}
.gauge{position:relative;max-width:260px;margin:0 auto}
.gauge svg{display:block;width:100%}
.g-bg,.g-fg{fill:none;stroke-width:16;stroke-linecap:round}
.g-bg{stroke:var(--fill2)}
.g-fg{stroke:var(--pri);transition:stroke-dasharray .35s ease,stroke .2s}
.gauge.over .g-fg{stroke:var(--over)}
.gauge__mid{position:absolute;left:0;right:0;bottom:0;text-align:center}
.gauge__n{font-size:44px;font-weight:800;letter-spacing:-0.02em;line-height:1}
.gauge__l{margin-top:2px;color:var(--text2);font-size:14px;font-weight:600}
.hero__row{display:flex;justify-content:space-between;gap:12px;margin-top:12px;color:var(--text2);font-size:14px}
.hero__row b{display:block;color:var(--text);font-size:17px;font-weight:800}
.hero__row div:last-child{text-align:right}
.state{display:flex;align-items:center;justify-content:center;gap:6px;min-height:36px;margin-top:12px;border-radius:999px;background:var(--fill);color:var(--text2);font-size:15px;font-weight:700}
.state.win{background:var(--pri-soft);color:var(--pri)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:2px;margin-top:12px;padding:3px;border-radius:14px;background:var(--fill)}
.seg button{min-height:36px;border:0;border-radius:11px;background:transparent;font-size:15px;font-weight:700}
.seg button[aria-checked="true"]{background:var(--card);box-shadow:0 1px 4px rgba(47,33,30,.16)}
.seg--sm{margin-top:8px}
.seg--sm button{min-height:34px;padding:0 2px;font-size:14px}

/* riga dei macro: resta in alto mentre scorri, e si tocca per lo spaccato */
.macro{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;margin:10px -16px 0;padding:7px 16px 8px;background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border-bottom:1px solid var(--sep)}
.mrow{display:grid;grid-template-columns:1.15fr repeat(4,1fr) 14px;gap:8px;align-items:center;max-width:528px;margin:0 auto}
.mc{display:block;min-width:0;padding:3px 0;border:0;border-radius:10px;background:none;text-align:left}
.mc__k{display:block;color:var(--text2);font-size:12px;font-weight:700}
.mc__v{display:block;font-size:15px;font-weight:800;white-space:nowrap}
.mc__v small{color:var(--text2);font-size:12px;font-weight:600}
.mc__b{display:block;height:5px;margin-top:4px;border-radius:3px;background:var(--fill2);overflow:hidden}
.mc__b i{display:block;height:100%;width:0;border-radius:3px;background:var(--bar);transition:width .3s ease}
.mc__b i.over{background:var(--over)}
.mrow > svg{width:14px;height:14px;color:var(--text2)}

/* pasti */
.meal{margin-top:14px;padding:6px 14px 8px;border-radius:22px;background:var(--card)}
.meal__head{display:grid;grid-template-columns:minmax(0,1fr) 40px 44px;align-items:center;gap:8px;min-height:60px}
.meal__open{display:grid;grid-template-columns:44px minmax(0,1fr);align-items:center;gap:10px;min-height:56px;padding:0;border:0;border-radius:14px;background:none;text-align:left;font-size:17px}
.meal__name{display:block;font-size:18px;font-weight:800;line-height:1.15;overflow-wrap:anywhere}
.meal__sum{display:block;color:var(--text2);font-size:14px}
.check{display:grid;place-items:center;width:40px;height:40px;padding:0;border:2px solid var(--fill2);border-radius:50%;background:none;color:var(--text2)}
.check svg{width:18px;height:18px;opacity:.45}
.check[aria-pressed="true"]{border-color:var(--pri);background:var(--pri);color:var(--pri-ink)}
.check[aria-pressed="true"] svg{opacity:1}
.meal.eaten .ico{background:var(--pri-soft)}
.ico{display:grid;place-items:center;width:44px;height:44px;border-radius:14px;background:var(--fill);font-size:24px;line-height:1}
.plus{width:44px;height:44px;border:0;border-radius:50%;background:var(--pri);color:var(--pri-ink);display:grid;place-items:center}
.plus svg{width:20px;height:20px}
.food{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:8px;min-height:58px;border-top:1px solid var(--sep)}
.food__main{display:grid;grid-template-columns:36px minmax(0,1fr);align-items:center;gap:10px;min-height:56px;padding:0;border:0;background:none;text-align:left;font-size:17px}
.food__main .emo{font-size:26px;text-align:center}
.food__main b{display:block;font-weight:700;overflow-wrap:anywhere}
.food__main small{display:block;color:var(--text2);font-size:13px}
.qty{display:inline-grid;grid-template-columns:34px auto 34px;align-items:center;border-radius:999px;background:var(--fill)}
.qty button{height:38px;border:0;background:none;font-size:15px;font-weight:800}
.qty button svg{width:14px;height:14px;display:block;margin:0 auto}
.qty__v{min-width:52px;padding:0 2px}
.empty{padding:10px 0 6px;border-top:1px solid var(--sep);color:var(--text2);font-size:15px}

/* consigli e pulsanti */
.sect{margin-top:22px}
.sect__head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:0 4px 8px}
.sect__head h2{font-size:20px;font-weight:800}
.card{border-radius:22px;background:var(--card);padding:4px 14px}
.card > :last-child{border-bottom:0}
.coach{padding:14px}
.coach__msg{font-weight:700}
.coach__sub{margin-top:6px;color:var(--text2);font-size:15px}
.coach__after{margin-top:12px;padding:10px 12px;border-radius:14px;background:var(--fill);font-size:15px}
.coach__foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px;padding-top:6px;border-top:1px solid var(--sep);color:var(--text2);font-size:13px}
.sugg{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:10px;margin-top:10px;padding-top:10px;border-top:1px solid var(--sep)}
.sugg b{display:block;font-weight:700}
.sugg small{display:block;margin-top:2px;color:var(--text2);font-size:14px}
.sugg.done{opacity:.6}
.pill{min-height:38px;padding:0 16px;border:0;border-radius:999px;background:var(--pri);color:var(--pri-ink);font-size:15px;font-weight:700}
.pill[disabled]{background:var(--fill);color:var(--text2);cursor:default}
.pill--soft{background:var(--pri-soft);color:var(--pri)}
.pill--plain{background:var(--fill);color:var(--text)}
.pill--wide{width:100%;min-height:48px;font-size:17px}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.lead{margin-top:10px;padding:0 4px;color:var(--text2);font-size:15px}
.textbtn{min-height:44px;padding:0 4px;border:0;background:none;color:var(--pri);font-size:17px;font-weight:800}
.textbtn--sm{min-height:34px;font-size:14px}

/* pulsante che compare quando cambi la giornata */
.fab{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));z-index:19;transform:translateX(-50%);display:inline-flex;align-items:center;gap:8px;min-height:46px;padding:0 20px;border:0;border-radius:999px;background:var(--pri);color:var(--pri-ink);font-size:16px;font-weight:800;white-space:nowrap;box-shadow:var(--glass-shadow)}

/* genera */
.gen{display:grid;justify-items:center;gap:10px;padding:28px 20px 24px;text-align:center}
.gen__img{width:88px;height:88px;border-radius:22px;box-shadow:0 6px 18px rgba(47,33,30,.2)}
.gen h2{margin-top:4px;font-size:22px;font-weight:800}
.gen p{max-width:34ch;color:var(--text2);font-size:16px}
.tag{display:inline-block;margin-top:4px;padding:4px 12px;border-radius:999px;background:var(--fill);color:var(--text2);font-size:13px;font-weight:800}

/* settimana */
.day{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:2px 10px;align-items:center;width:100%;min-height:74px;padding:10px 0;border:0;border-bottom:1px solid var(--sep);background:none;font-size:17px;text-align:left}
.day .ico{grid-row:1 / span 2}
.day__name{font-weight:800}
.day__type{color:var(--text2);font-size:14px;font-weight:700}
.day__prev{grid-column:2 / -1;color:var(--text2);font-size:14px}
.day__kcal{text-align:right;font-size:13px;color:var(--text2)}
.day__kcal b{display:block;color:var(--text);font-size:16px}
.buy{display:grid;grid-template-columns:28px 30px minmax(0,1fr) auto;align-items:center;gap:8px;min-height:52px;border-bottom:1px solid var(--sep)}
.buy input{width:22px;height:22px;accent-color:var(--pri)}
.buy .emo{font-size:22px}
.buy span:last-child{color:var(--text2)}
.buy:has(input:checked) span:not(.emo){text-decoration:line-through;color:var(--text2)}

/* spaccati */
.bo-list{padding:4px 6px}
.bo{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:baseline;gap:6px 10px;width:100%;padding:10px 8px;border:0;border-radius:14px;background:none;text-align:left;font-size:16px}
.bo[aria-pressed="true"]{background:var(--fill)}
.bo__k{font-weight:800}
.bo__v{font-weight:800;white-space:nowrap}
.bo__v small{color:var(--text2);font-size:13px;font-weight:600}
.stack{grid-column:1 / -1;position:relative;display:flex;height:12px;border-radius:6px;background:var(--fill);overflow:hidden}
.stack i{display:block;height:100%;border-right:2px solid var(--card)}
.stack__tgt{position:absolute;top:0;bottom:0;width:3px;margin-left:-1.5px;border-radius:2px;background:var(--text)}
.br{display:grid;grid-template-columns:10px 28px minmax(0,1fr) auto;align-items:center;gap:6px 10px;width:100%;padding:10px 0;border:0;border-bottom:1px solid var(--sep);background:none;text-align:left;font-size:16px}
.br__dot{width:10px;height:10px;border-radius:50%}
.br .emo{font-size:22px;text-align:center}
.br__n{min-width:0}
.br__n b{display:block;font-weight:700;overflow-wrap:anywhere}
.br__n small,.br__v small{display:block;color:var(--text2);font-size:13px}
.br__v{text-align:right;white-space:nowrap}
.br__v b{font-weight:800}
.br__bar{grid-column:3 / -1;height:6px;border-radius:3px;background:var(--fill);overflow:hidden}
.br__bar i{display:block;height:100%;border-radius:3px}

/* dock a vetro */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;padding:0 14px calc(10px + env(safe-area-inset-bottom,0px));pointer-events:none}
.dock__in{pointer-events:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:2px;width:100%;max-width:330px;padding:6px;border-radius:34px;background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--glass-line);box-shadow:var(--glass-shadow)}
.dock a{display:grid;justify-items:center;align-content:center;gap:2px;min-height:56px;padding:6px 2px;border-radius:28px;color:var(--text2);font-size:11px;font-weight:700;text-decoration:none}
.dock a svg{width:24px;height:24px}
.dock a[aria-current="page"]{background:var(--pri-soft);color:var(--pri)}
.dock a.mid span{display:grid;place-items:center;width:46px;height:28px;border-radius:14px;background:var(--pri);color:var(--pri-ink)}
.dock a.mid svg{width:19px;height:19px}

/* pannello dal basso */
dialog.sheet{position:fixed;inset:auto 0 0 0;width:100%;max-width:560px;max-height:88%;margin:0 auto;padding:0;border:0;border-radius:26px 26px 0 0;background:var(--bg);color:var(--text);overflow:auto;overscroll-behavior:contain}
dialog.sheet:not([open]){display:none}
dialog::backdrop{background:rgba(30,22,20,.45)}
.sheet__head{position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px 10px;background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
.sheet__head h2{font-size:20px;font-weight:800}
.sheet__head h2:focus{outline:none}
.sheet__body{padding:6px 16px calc(26px + env(safe-area-inset-bottom,0px))}
.field{display:block;width:100%;height:52px;padding:0 16px;border:2px solid transparent;border-radius:16px;background:var(--card);color:var(--text);font-size:17px;-webkit-appearance:none;appearance:none}
.field:focus{border-color:var(--pri);outline:none}
.field::placeholder{color:var(--text2)}
.hint{margin-top:8px;padding:0 4px;color:var(--text2);font-size:14px}
.sub{margin:18px 4px 8px;font-size:15px;font-weight:800;color:var(--text2)}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.quick--3{grid-template-columns:repeat(3,1fr);margin-top:12px}
.quick button{display:grid;justify-items:center;gap:4px;min-height:76px;padding:10px 4px 8px;border:2px solid transparent;border-radius:18px;background:var(--card);font-size:12px;font-weight:700;line-height:1.15;text-align:center}
.quick button .emo{font-size:28px}
.quick button.on{border-color:var(--pri);background:var(--pri-soft)}
.acts-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.acts-grid button{display:grid;justify-items:center;align-content:center;gap:6px;min-height:84px;padding:10px 4px;border:2px solid transparent;border-radius:18px;background:var(--card);font-size:13px;font-weight:700;line-height:1.15;text-align:center}
.acts-grid button .emo{font-size:30px}
.acts-grid button[aria-pressed="true"]{border-color:var(--pri);background:var(--pri-soft)}
.dur{padding:10px 0;border-bottom:1px solid var(--sep)}
.dur__n{display:flex;align-items:center;gap:8px;font-weight:700}
.pick{display:grid;grid-template-columns:36px minmax(0,1fr) auto;align-items:center;gap:10px;width:100%;min-height:56px;border:0;border-bottom:1px solid var(--sep);background:none;font-size:17px;text-align:left}
.pick .emo{font-size:24px;text-align:center}
.pick small{display:block;color:var(--text2);font-size:13px}
.pick > span:last-child{color:var(--pri);font-size:14px;font-weight:800}
.amount{display:grid;grid-template-columns:56px 1fr 56px;align-items:center;gap:10px;margin-top:8px}
.amount button{width:56px;height:56px;border:0;border-radius:50%;background:var(--card);display:grid;place-items:center}
.amount button svg{width:22px;height:22px}
.amount__n{text-align:center;font-size:44px;font-weight:800;letter-spacing:-0.02em;line-height:1}
.amount__n small{font-size:20px;color:var(--text2)}
input[type="range"]{width:100%;margin:16px 0 4px;accent-color:var(--pri)}
.impact{margin-top:12px;padding:12px 14px;border-radius:16px;background:var(--card);font-size:15px}
.impact b{font-weight:800}

@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}
</style>
</head>
<body>

<main id="main"><div id="view"></div></main>

<button type="button" class="fab" id="fab" hidden>✨ Analizza la giornata</button>

<script>
(() => {
'use strict';

/* ---------- dati di esempio (inventati) ---------- */
const MACROS = [
  { key: 'kcal', head: 'kcal', name: 'Calorie', long: 'kcal', w: 2 },
  { key: 'p', head: 'Proteine', name: 'Proteine', long: 'g di proteine', w: 1.6 },

  { key: 'fib', head: 'Fibre', name: 'Fibre', long: 'g di fibre', w: 0.2 },
];
const MK = Object.fromEntries(MACROS.map((m) => [m.key, m]));
const CORE = MACROS.slice(0, 4);

/* obiettivi di una giornata di riposo: le attività aggiungono calorie, sotto forma di carboidrati */

/* stime indicative: calorie in più per un'ora di attività */
const ACTIVITIES = [
  { id: 'palestra', name: 'Palestra', ico: '🏋️', kcalH: 300 },
  { id: 'apnea', name: 'Apnea', ico: '🤿', kcalH: 160 },
  { id: 'corsa', name: 'Corsa', ico: '🏃', kcalH: 600 },
  { id: 'bici', name: 'Bici', ico: '🚴', kcalH: 450 },
  { id: 'nuoto', name: 'Nuoto', ico: '🏊', kcalH: 450 },
  { id: 'camminata', name: 'Camminata', ico: '🚶', kcalH: 200 },
  { id: 'trekking', name: 'Trekking', ico: '🥾', kcalH: 380 },
  { id: 'padel', name: 'Padel e tennis', ico: '🎾', kcalH: 420 },
  { id: 'calcetto', name: 'Calcetto', ico: '⚽', kcalH: 500 },
  { id: 'funzionale', name: 'Funzionale', ico: '🤸', kcalH: 450 },
  { id: 'yoga', name: 'Yoga e pilates', ico: '🧘', kcalH: 150 },
  { id: 'surf', name: 'Surf e SUP', ico: '🏄', kcalH: 300 },
];
const ACT = Object.fromEntries(ACTIVITIES.map((a) => [a.id, a]));
const DURATIONS = [30, 45, 60, 90, 120];

/* i cinque pasti di sempre, più quelli che aggiungi tu */
const BASE_MEALS = [
  { id: 'colazione', name: 'Colazione', ico: '☕', time: '08:00', a: 'a colazione', da: 'dalla colazione' },
  { id: 'spuntino_mattina', name: 'Spuntino mattina', ico: '🍏', time: '10:30', a: 'allo spuntino del mattino', da: 'dallo spuntino del mattino' },
  { id: 'pranzo', name: 'Pranzo', ico: '🍽️', time: '13:00', a: 'a pranzo', da: 'dal pranzo' },
  { id: 'spuntino_pomeriggio', name: 'Spuntino pomeriggio', ico: '🥜', time: '16:30', a: 'allo spuntino del pomeriggio', da: 'dallo spuntino del pomeriggio' },
  { id: 'cena', name: 'Cena', ico: '🌙', time: '20:00', a: 'a cena', da: 'dalla cena' },
];
const BASE_BY_ID = Object.fromEntries(BASE_MEALS.map((b) => [b.id, b]));
const EXTRA_MEALS = [
  { name: 'Pre-allenamento', ico: '⚡', time: '17:30' },
  { name: 'Post-allenamento', ico: '💪', time: '19:00' },
  { name: 'Spuntino serale', ico: '🍵', time: '22:00' },
];
const SNACK_MEALS = ['spuntino_mattina', 'spuntino_pomeriggio'];
const MAIN_MEALS = ['pranzo', 'cena'];

const F = (name, ico, cat, slot, kcal, p, c, f, fib, portion, kw, unit) => ({ name, ico, cat, slot, kcal, p, c, f, fib, portion, kw, unit });
const FOODS = {
  yogurt: F('Yogurt greco 0%', '🥛', 'pro', 'snack', 57, 10, 4, 0.2, 0, 170, ['yogurt'], 170),
  avena: F('Fiocchi d’avena', '🥣', 'carb', 'snack', 372, 13.5, 58.7, 7, 10, 50, ['avena', 'fiocchi d avena', 'fiocchi di avena']),
  banana: F('Banana', '🍌', 'fruit', 'snack', 89, 1.1, 20, 0.3, 2.6, 120, ['banana', 'banane'], 120),
  mela: F('Mela', '🍎', 'fruit', 'snack', 52, 0.3, 11.4, 0.2, 2.4, 180, ['mela', 'mele'], 180),
  mandorle: F('Mandorle', '🥜', 'fat', 'snack', 603, 22, 4.6, 55.3, 12.7, 25, ['mandorle', 'mandorla']),
  uova: F('Uova', '🥚', 'pro', 'main', 140, 12.5, 0.6, 9.7, 0, 120, ['uova', 'uovo'], 60),
  pane: F('Pane integrale', '🍞', 'carb', 'snack', 240, 9, 42, 3, 6.5, 60, ['pane', 'fetta', 'fette'], 40),
  piadina: F('Piadina integrale', '🫓', 'carb', 'snack', 290, 9, 48, 6, 5, 80, ['piadina', 'piadine'], 80),
  fiocchi: F('Fiocchi di latte', '🧀', 'pro', 'snack', 97, 11, 3, 4.5, 0, 150, ['fiocchi di latte', 'fiocchi']),
  tonno: F('Tonno al naturale', '🥫', 'pro', 'main', 103, 24, 0, 0.8, 0, 80, ['tonno'], 80),
  riso: F('Riso basmati', '🍚', 'carb', 'main', 350, 8, 77, 0.8, 1.5, 90, ['riso', 'basmati']),
  pasta: F('Pasta di semola', '🍝', 'carb', 'main', 356, 12.5, 72, 1.5, 3, 100, ['pasta', 'spaghetti', 'penne']),
  patate: F('Patate', '🥔', 'carb', 'main', 80, 2, 17, 0.1, 1.8, 300, ['patate', 'patata']),
  pollo: F('Petto di pollo', '🍗', 'pro', 'main', 108, 23, 0, 1.5, 0, 180, ['pollo']),
  manzo: F('Macinato di manzo magro', '🥩', 'pro', 'main', 137, 21, 0, 5.5, 0, 150, ['manzo', 'macinato', 'hamburger']),
  salmone: F('Salmone', '🐟', 'pro', 'main', 185, 20, 0, 12, 0, 150, ['salmone']),
  ceci: F('Ceci cotti', '🫘', 'pro', 'main', 120, 7, 14, 2.5, 6, 150, ['ceci']),
  zucchine: F('Zucchine', '🥒', 'veg', 'main', 17, 1.3, 1.4, 0.1, 1.2, 200, ['zucchine', 'zucchina']),
  olio: F('Olio extravergine d’oliva', '🫒', 'fat', 'main', 899, 0, 0, 99.9, 0, 10, ['olio']),
};
const SHORT = { yogurt: 'Yogurt', avena: 'Avena', pollo: 'Pollo', olio: 'Olio', pane: 'Pane', tonno: 'Tonno', riso: 'Riso', uova: 'Uova', banana: 'Banana' };
const OFTEN = ['uova', 'yogurt', 'riso', 'pollo', 'pane', 'banana', 'tonno', 'olio'];

/* menu di prova: uno per giornate intense, uno per giornate leggere e uno per il riposo, in due varianti */
const TEMPLATES = {
  alto: [
    { colazione: [['yogurt', 250], ['avena', 60], ['banana', 120]], spuntino_mattina: [['mela', 180], ['mandorle', 15]], pranzo: [['riso', 110], ['pollo', 200], ['zucchine', 200], ['olio', 15]], spuntino_pomeriggio: [['pane', 80], ['tonno', 80]], cena: [['pasta', 100], ['salmone', 160], ['olio', 10]] },
    { colazione: [['uova', 120], ['pane', 80], ['banana', 120]], spuntino_mattina: [['yogurt', 170], ['mandorle', 20]], pranzo: [['pasta', 110], ['manzo', 160], ['zucchine', 200], ['olio', 10]], spuntino_pomeriggio: [['piadina', 80], ['fiocchi', 100]], cena: [['patate', 350], ['pollo', 200], ['olio', 15]] },
  ],
  medio: [
    { colazione: [['yogurt', 250], ['avena', 60], ['mela', 180]], spuntino_mattina: [['mandorle', 20]], pranzo: [['riso', 100], ['salmone', 150], ['zucchine', 200], ['olio', 10]], spuntino_pomeriggio: [['piadina', 80], ['fiocchi', 120]], cena: [['pasta', 90], ['ceci', 150], ['tonno', 80], ['olio', 10]] },
    { colazione: [['uova', 120], ['pane', 80], ['mela', 180]], spuntino_mattina: [['yogurt', 170], ['mandorle', 20]], pranzo: [['pasta', 100], ['pollo', 180], ['zucchine', 200], ['olio', 10]], spuntino_pomeriggio: [['banana', 120]], cena: [['riso', 90], ['manzo', 150], ['zucchine', 200], ['olio', 10]] },
  ],
  basso: [
    { colazione: [['uova', 120], ['pane', 60], ['banana', 120]], spuntino_mattina: [['mela', 180]], pranzo: [['pasta', 90], ['tonno', 120], ['zucchine', 200], ['olio', 10]], spuntino_pomeriggio: [['yogurt', 170], ['mandorle', 25]], cena: [['pollo', 180], ['riso', 70], ['zucchine', 200], ['olio', 10]] },
    { colazione: [['yogurt', 250], ['avena', 50], ['mela', 180]], spuntino_mattina: [['mandorle', 20]], pranzo: [['riso', 90], ['manzo', 150], ['zucchine', 200], ['olio', 10]], spuntino_pomeriggio: [['fiocchi', 150], ['pane', 60]], cena: [['salmone', 150], ['patate', 300], ['olio', 10]] },
  ],
};
const DEFAULT_PLAN = [[['palestra', 60]], [['apnea', 60]], [['palestra', 60]], [], [['palestra', 60]], [['camminata', 60]], []];

/* ---------- utilità ---------- */
const $ = (s, r) => (r || document).querySelector(s);
const uid = () => 'e' + Math.random().toString(36).slice(2, 9);
const fmt0 = (n) => Math.round(n).toLocaleString('it-IT');
const fmt1 = (n) => (Math.round(n * 10) / 10).toLocaleString('it-IT', { maximumFractionDigits: 1 });
const fmtG = (n) => (Math.abs(n) < 10 ? fmt1(n) : fmt0(n));
const fmtM = (m, n) => (m.key === 'kcal' ? fmt0(n) : fmtG(n));
const unitOf = (m) => (m.key === 'kcal' ? ' kcal' : ' g');
const signed = (n) => (n > 0 ? '+' : n < 0 ? '−' : '') + fmt0(Math.abs(n));
const pctTxt = (a, b) => (b > 0 ? Math.round(a / b * 100) : 0) + '%';
const lc = (s) => s.charAt(0).toLowerCase() + s.slice(1);
const andJoin = (a) => (a.length > 1 ? a.slice(0, -1).join(', ') + ' e ' + a[a.length - 1] : a[0]);
const norm = (s) => String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
function h(tag, props, ...kids) {
  const n = document.createElement(tag);
  if (props) for (const [k, v] of Object.entries(props)) {
    if (v == null || v === false) continue;
    if (k === 'class') n.className = v;
    else if (k === 'text') n.textContent = v;
    else if (k === 'value') n.value = v;
    else if (k.startsWith('on') && typeof v === 'function') n.addEventListener(k.slice(2), v);
    else if (v === true) n.setAttribute(k, '');
    else n.setAttribute(k, v);
  }
  for (const kid of kids.flat()) {
    if (kid == null || kid === false) continue;
    n.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
  return n;
}
const emo = (e) => h('span', { class: 'emo', 'aria-hidden': 'true', text: e });
const ICONS = { plus: 'M12 5v14M5 12h14', minus: 'M5 12h14', chev: 'M9 6l6 6-6 6', check: 'M5 12.5l4.5 4.5L19 7.5' };
function icon(name) {
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  for (const [k, v] of Object.entries({ viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', 'stroke-width': '2.4', 'stroke-linecap': 'round', 'stroke-linejoin': 'round', 'aria-hidden': 'true' })) svg.setAttribute(k, v);
  const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  p.setAttribute('d', ICONS[name]); svg.append(p);
  return svg;
}

/* ---------- date ---------- */
const keyOf = (d) => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const dateOf = (k) => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d, 12); };
const shiftKey = (k, n) => { const d = dateOf(k); d.setDate(d.getDate() + n); return keyOf(d); };
const todayKey = () => keyOf(new Date());
const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);
const weekdayName = (k) => cap(new Intl.DateTimeFormat('it-IT', { weekday: 'long' }).format(dateOf(k)));
const dayMonth = (k) => new Intl.DateTimeFormat('it-IT', { day: 'numeric', month: 'long' }).format(dateOf(k));
function mondayOf(k) { const d = dateOf(k); d.setDate(d.getDate() - (d.getDay() + 6) % 7); return keyOf(d); }
function dayTitle(k) { const t = todayKey(); return k === t ? 'Oggi' : k === shiftKey(t, 1) ? 'Domani' : k === shiftKey(t, -1) ? 'Ieri' : weekdayName(k); }

/* ---------- calcoli ---------- */
const ZERO = () => ({ kcal: 0, p: 0, c: 0, f: 0, fib: 0 });
const scale = (food, g) => { const o = ZERO(); for (const m of MACROS) o[m.key] = FOODS[food][m.key] * g / 100; return o; };
const addTo = (a, b) => { const o = { ...a }; for (const m of MACROS) o[m.key] += b[m.key]; return o; };
const sum = (items) => items.reduce((acc, e) => addTo(acc, scale(e.food, e.g)), ZERO());
const allItems = (day) => day.meals.flatMap((m) => m.items);
const totals = (day) => sum(allItems(day));
const extraKcal = (day) => day.acts.reduce((s, a) => s + ACT[a.id].kcalH * a.min / 60, 0);
function targetOf(day) {
  const x = extraKcal(day);
  return { ...BASE_TARGET, kcal: Math.round((BASE_TARGET.kcal + x) / 10) * 10, c: Math.round((BASE_TARGET.c + x / 4) / 5) * 5 };
}
const tolOf = (m, tgt) => tgt[m.key] * (m.key === 'kcal' ? 0.04 : 0.08);
const okCount = (tot, tgt) => CORE.filter((m) => Math.abs(tot[m.key] - tgt[m.key]) <= tolOf(m, tgt)).length;
function errorOf(tot, tgt) { let e = 0; for (const m of MACROS) { const r = (tot[m.key] - tgt[m.key]) / tgt[m.key]; e += m.w * r * r; } return e; }
const stepOf = (food) => (FOODS[food].portion >= 60 ? 10 : 5);
const roundTo = (g, st) => Math.max(st, Math.round(g / st) * st);
function balance(day) {
  const tgt = targetOf(day); const items = allItems(day);
  const base = new Map(items.map((e) => [e.id, e.g]));
  for (let i = 0; i < 80; i++) {
    const tot = totals(day); const cur = errorOf(tot, tgt); let best = null;
    for (const e of items) for (const dir of [1, -1]) {
      const g = e.g + dir * stepOf(e.food); const b = base.get(e.id);
      if (g < b * 0.5 || g > b * 2 || g <= 0) continue;
      const err = errorOf(addTo(tot, scale(e.food, g - e.g)), tgt);
      if (err < cur - 1e-6 && (!best || err < best.err)) best = { e, g, err };
    }
    if (!best) break;
    best.e.g = best.g;
  }
  return day;
}
const tierOf = (day) => { const x = extraKcal(day); return x >= 250 ? 'alto' : x > 0 ? 'medio' : 'basso'; };
function buildDay(acts, variant) {
  const day = { acts: acts.map(([id, min]) => ({ id, min })), meals: BASE_MEALS.map((b) => ({ id: b.id, name: b.name, ico: b.ico, time: b.time, custom: false, eaten: false, items: [] })) };
  const tpl = TEMPLATES[tierOf(day)][variant % 2];
  for (const meal of day.meals) meal.items = (tpl[meal.id] || []).map(([food, g]) => ({ id: uid(), food, g }));
  return balance(day);
}
const findMeal = (day, id) => day.meals.find((m) => m.id === id);
const sortMeals = (day) => day.meals.sort((a, b) => a.time.localeCompare(b.time));
const toMeal = (meal) => (!meal.custom && BASE_BY_ID[meal.id] ? BASE_BY_ID[meal.id].a : 'a «' + meal.name + '»');
const fromMeal = (meal) => (!meal.custom && BASE_BY_ID[meal.id] ? BASE_BY_ID[meal.id].da : 'da «' + meal.name + '»');
const durLabel = (min) => (min < 60 ? min + '′' : min % 60 ? Math.floor(min / 60) + ' h ' + (min % 60) + '′' : min / 60 + ' h');
const actsLabel = (day) => (day.acts.length ? day.acts.map((a) => ACT[a.id].name + ' ' + durLabel(a.min)).join(' · ') : 'Riposo');
const sigOf = (day) => JSON.stringify([day.acts.map((a) => a.id + a.min), day.meals.map((m) => m.id + (m.eaten ? '!' : '') + ':' + m.items.map((e) => e.food + e.g).join(','))]);

/* ---------- stato (solo in memoria, per ora) ---------- */
const state = { date: todayKey(), days: {}, week: [], weekTab: 'piano', bought: {}, analysis: {}, seen: {}, bdMacro: 'kcal' };
function buildWeek(plan) {
  const mon = mondayOf(todayKey()); state.week = [];
  for (let i = 0; i < 7; i++) { const k = shiftKey(mon, i); state.week.push(k); state.days[k] = buildDay(plan[i] || [], i); }
  state.bought = {}; state.analysis = {}; state.seen = {};
  if (!state.week.includes(state.date)) state.date = todayKey();
}
const getDay = (k) => state.days[k] || (state.days[k] = buildDay([], 0));
function statusOf(k) {
  const day = getDay(k); const tot = totals(day); const tgt = targetOf(day); const ok = okCount(tot, tgt);
  return { day, tot, tgt, ok, perfect: ok === 4 };
}

/* ---------- analisi: cosa manca, cosa togliere (regole semplici, senza AI) ---------- */
function gapText(tot, tgt) {
  const under = []; const over = [];
  for (const m of CORE) {
    const d = tot[m.key] - tgt[m.key];
    if (d < -tolOf(m, tgt)) under.push(fmt0(-d) + ' ' + m.long); else if (d > tolOf(m, tgt)) over.push(fmt0(d) + ' ' + m.long);
  }
  if (!under.length && !over.length) return '';
  return [under.length ? 'Ti mancano ' + andJoin(under) : '', over.length ? (under.length ? 'e sei oltre di ' : 'Sei oltre di ') + andJoin(over) : ''].filter(Boolean).join(' ') + '.';
}
function mealFor(day, food) {
  const snack = FOODS[food].slot === 'snack'; const pool = snack ? SNACK_MEALS : MAIN_MEALS;
  const open = day.meals.filter((m) => !m.eaten);
  let list = open.filter((m) => (m.custom ? snack : pool.includes(m.id)));
  if (!list.length) list = open;
  let best = null; let low = Infinity;
  for (const m of list) { const kc = sum(m.items).kcal; if (kc < low) { low = kc; best = m; } }
  return best;
}
function analyze(k) {
  const day = getDay(k); const tgt = targetOf(day); const start = totals(day);
  let tot = start; const moves = []; const touched = new Set(); let adds = 0;
  const present = new Set(allItems(day).map((e) => e.food));
  for (let step = 0; step < 3 && okCount(tot, tgt) < 4; step++) {
    const cur = errorOf(tot, tgt); let best = null;
    const consider = (mv, delta) => {
      const t = addTo(tot, delta); const err = errorOf(t, tgt);
      if (err < cur * 0.93 && (!best || err < best.err)) best = { ...mv, err, t, delta };
    };
    for (const meal of day.meals) for (const e of meal.items) {
      if (meal.eaten || touched.has(e.id)) continue;
      const st = stepOf(e.food);
      for (const mult of [2, 1.5, 1.25, 0.75, 0.5]) {
        const g = roundTo(e.g * mult, st);
        if (g !== e.g) consider({ kind: g > e.g ? 'inc' : 'dec', meal: meal.id, entry: e.id, food: e.food, from: e.g, g }, scale(e.food, g - e.g));
      }
      consider({ kind: 'remove', meal: meal.id, entry: e.id, food: e.food, from: e.g, g: 0 }, scale(e.food, -e.g));
    }
    if (adds < 2) for (const id of Object.keys(FOODS)) {
      if (present.has(id)) continue;
      const meal = mealFor(day, id); if (!meal) continue;
      for (const part of [1, 0.5]) { const g = roundTo(FOODS[id].portion * part, stepOf(id)); consider({ kind: 'add', meal: meal.id, food: id, g }, scale(id, g)); }
    }
    if (!best) break;
    moves.push(best); tot = best.t;
    if (best.entry) touched.add(best.entry);
    if (best.kind === 'add') { adds++; present.add(best.food); }
  }
  for (const mv of moves) {
    const meal = findMeal(day, mv.meal); const fn = lc(FOODS[mv.food].name);
    if (mv.kind === 'add') { mv.title = 'Aggiungi ' + fn + ' ' + toMeal(meal); mv.detail = fmt0(mv.g) + ' g'; }
    else if (mv.kind === 'remove') { mv.title = 'Togli ' + fn + ' ' + fromMeal(meal); mv.detail = fmt0(mv.from) + ' g in meno'; }
    else { mv.title = (mv.kind === 'inc' ? 'Più ' : 'Meno ') + fn + ' ' + toMeal(meal); mv.detail = 'da ' + fmt0(mv.from) + ' a ' + fmt0(mv.g) + ' g'; }

/* ---------- capire una frase: «150 g di riso e 2 uova» ---------- */
const NUMW = { un: 1, uno: 1, una: 1, due: 2, tre: 3, quattro: 4, cinque: 5, mezzo: 0.5, mezza: 0.5 };
const UNIT = '(kg|chili|chilo|etti|etto|hg|grammi|grammo|gr|g)';
function gramsOf(n, u, f) {
  if (u === 'kg' || u === 'chili' || u === 'chilo') return n * 1000;
  if (u === 'etti' || u === 'etto' || u === 'hg') return n * 100;
  if (u || n >= 20) return n;
  return n * (f.unit || f.portion);
}
function parseFoods(text) {
  /* la virgola tra due cifre è un decimale («1,5 etti»), non un separatore */
  const t = norm(text).replace(/['’]/g, ' ').replace(/(\d),(\d)/g, '$1.$2');
  const chunks = (' ' + t + ' ').split(/,|\+|;| e | con | piu /).map((s) => s.trim()).filter(Boolean);
  const out = [];
  for (const ch of chunks) {
    let best = null;
    for (const [id, f] of Object.entries(FOODS)) for (const kw of f.kw) {
      if (new RegExp('\\b' + kw + '\\b').test(ch) && (!best || kw.length > best.kw.length)) best = { id, kw };
    }
    if (!best) continue;
    const f = FOODS[best.id]; let g = f.portion;
    const m = ch.match(new RegExp('(\\d+(?:\\.\\d+)?)\\s*' + UNIT + '?\\b'));
    if (m) g = gramsOf(parseFloat(m[1]), m[2], f);
    else {
      const w = ch.split(/\s+/).find((x) => NUMW[x] != null);
      if (w) { const um = ch.match(new RegExp('\\b' + UNIT + '\\b')); g = gramsOf(NUMW[w], um && um[1], f); }
    }
    if (g > 0) out.push({ food: best.id, g: Math.round(g) });
  }
  return out;
}
function swapsFor(e) {
  const f = FOODS[e.food];
  const key = f.cat === 'carb' || f.cat === 'fruit' ? 'c' : f.cat === 'pro' ? 'p' : f.cat === 'fat' ? 'f' : 'kcal';
  const amount = f[key] * e.g / 100;
  const label = { c: 'Stessi carboidrati', p: 'Stesse proteine', f: 'Stessi grassi', kcal: 'Stesse calorie' }[key];
  const list = Object.entries(FOODS).filter(([id, x]) => id !== e.food && x.cat === f.cat && x[key] > 0)
    .map(([id, x]) => { const st = stepOf(id); return { id, g: roundTo(amount / x[key] * 100, st) }; }).slice(0, 4);
  return { label, list };
}

      h('span', { class: 'br__n' }, h('b', { text: p.name }), h('small', { text: sub })),
      h('span', { class: 'br__v' }, h('b', { text: fmtM(m, v) + unitOf(m) }), h('small', { text: Math.round(share * 100) + '%' })),
      h('span', { class: 'br__bar', 'aria-hidden': 'true' }, h('i', { style: 'width:' + (share * 100).toFixed(2) + '%;background:' + col(i) })));
  }));
  return h('div', null, overview, h('p', { class: 'sub', text: m.name + (o.scope === 'day' ? ', pasto per pasto' : ', alimento per alimento') }), list);
}
function openDayBreakdown(mk) {
  if (mk) state.bdMacro = mk;
  const day = getDay(state.date);
  openSheet('Spaccato della giornata', (body) => {
    const draw = () => {
      const tot = totals(day); const tgt = targetOf(day);
      const parts = day.meals.map((m) => ({ key: m.id, ico: m.ico, name: m.name, sub: m.time, v: sum(m.items) }));
      body.replaceChildren(
        h('p', { class: 'hint', text: 'Come si distribuiscono calorie e macro nei pasti, dalla mattina alla sera. La lineetta verticale segna l’obiettivo. Tocca un pasto per aprirlo.' }),
        breakdownNode(parts, tot, { scope: 'day', macro: state.bdMacro, tgt, onPick: (m) => { state.bdMacro = m; draw(); }, onRow: (id) => openMealBreakdown(id) }));
    };
    draw();
  });
}
function openMealBreakdown(mealId) {
  const day = getDay(state.date);
  openSheet('', (body) => {
    const draw = () => {
      const meal = findMeal(day, mealId); if (!meal) return;
      $('#sheetTitle').textContent = meal.ico + ' ' + meal.name;
      const tot = sum(meal.items); const dayTot = totals(day);
      const parts = meal.items.map((e) => ({ key: e.id, ico: FOODS[e.food].ico, name: FOODS[e.food].name, sub: fmt0(e.g) + ' g', v: scale(e.food, e.g) }));
      const time = h('input', { class: 'field', type: 'time', value: meal.time, 'aria-label': 'Orario del pasto' });
      time.addEventListener('change', () => { if (time.value) { meal.time = time.value; sortMeals(day); draw(); } });
      body.replaceChildren(
        h('p', { class: 'hint', text: meal.items.length ? 'Alle ' + meal.time + ': ' + fmt0(tot.kcal) + ' kcal, il ' + pctTxt(tot.kcal, dayTot.kcal) + ' delle calorie della giornata. Ecco quanto pesa ogni alimento sui valori del pasto. Tocca un alimento per modificarlo.' : 'Questo pasto è ancora vuoto.' }),
        parts.length ? breakdownNode(parts, tot, { scope: 'meal', macro: state.bdMacro, dayTot, onPick: (m) => { state.bdMacro = m; draw(); }, onRow: (id) => openEdit(mealId, id) }) : null,
        h('div', { class: 'acts' }, h('button', { type: 'button', class: 'pill pill--wide', onclick: () => openAdd(mealId) }, '+ Aggiungi un alimento'),
          h('button', { type: 'button', class: 'pill pill--wide ' + (meal.eaten ? 'pill--soft' : 'pill--plain'), 'aria-pressed': String(!!meal.eaten), onclick: () => { meal.eaten = !meal.eaten; draw(); } }, meal.eaten ? '✓ Già mangiato' : 'Segna come già mangiato')),
        h('p', { class: 'sub', text: 'Orario' }), time,
        meal.custom ? h('div', { class: 'acts' }, h('button', { type: 'button', class: 'pill pill--plain pill--wide', onclick: () => { day.meals = day.meals.filter((x) => x.id !== mealId); closeSheet(); } }, 'Elimina questo pasto')) : null);
    };
    draw();
  });
}

/* un pasto in più, solo per questa giornata */
function openAddMeal() {
  const day = getDay(state.date);
  openSheet('Aggiungi un pasto', (body) => {
    let pick = EXTRA_MEALS[0];
    const name = h('input', { class: 'field', type: 'text', value: pick.name, autocomplete: 'off', 'aria-label': 'Nome del pasto' });
    const time = h('input', { class: 'field', type: 'time', value: pick.time, 'aria-label': 'Orario del pasto' });
    const grid = h('div', { class: 'quick quick--3' });
    const drawGrid = () => grid.replaceChildren(...EXTRA_MEALS.map((x) => h('button', { type: 'button', class: x === pick ? 'on' : '', onclick: () => { pick = x; name.value = x.name; time.value = x.time; drawGrid(); } }, emo(x.ico), x.name)));
    name.addEventListener('input', () => { pick = EXTRA_MEALS.find((x) => norm(x.name) === norm(name.value.trim())) || null; drawGrid(); });
    drawGrid();
    body.append(h('p', { class: 'hint', text: 'Per i pasti fuori dai cinque di sempre. Vale solo per questa giornata.' }), grid,
      h('p', { class: 'sub', text: 'Nome' }), name, h('p', { class: 'sub', text: 'Orario' }), time,
      h('div', { class: 'acts' }, h('button', { type: 'button', class: 'pill pill--wide', onclick: () => {
        const nm = name.value.trim() || 'Altro pasto';
        const meal = { id: 'x' + uid(), name: nm, ico: pick ? pick.ico : '🍴', time: time.value || '12:00', custom: true, eaten: false, items: [] };
        day.meals.push(meal); sortMeals(day); openAdd(meal.id);
      } }, 'Aggiungi e scegli gli alimenti')));
  });
}

/* aggiunta di alimenti: una frase, un tocco sui più usati, o l’elenco */
function openAdd(mealId) {
  const day = getDay(state.date); const meal = findMeal(day, mealId); if (!meal) return;
  openSheet('Aggiungi ' + toMeal(meal), (body) => {
    const input = h('input', { class: 'field', type: 'text', autocomplete: 'off', enterkeyhint: 'done', placeholder: 'Scrivi o detta: 150 g di riso e 2 uova', 'aria-label': 'Scrivi o detta cosa aggiungere' });
    const parsedBox = h('div'); const listBox = h('div');
    const add = (food, g) => meal.items.push({ id: uid(), food, g });
    const draw = () => {
      const q = input.value.trim(); const parsed = q ? parseFoods(q) : [];
      parsedBox.replaceChildren();
      if (parsed.length) {
        const tot = sum(parsed);
        parsedBox.append(h('p', { class: 'sub', text: 'Ho capito così' }),
          h('div', { class: 'card' }, parsed.map((p) => h('div', { class: 'pick' }, emo(FOODS[p.food].ico), h('span', null, FOODS[p.food].name, h('small', { text: fmt0(scale(p.food, p.g).kcal) + ' kcal' })), h('span', { text: fmt0(p.g) + ' g' })))),
          h('div', { class: 'acts' }, h('button', { type: 'button', class: 'pill pill--wide', onclick: () => { parsed.forEach((p) => add(p.food, p.g)); closeSheet(); } },
            'Aggiungi ' + (parsed.length === 1 ? 'un alimento' : parsed.length + ' alimenti') + ' (' + fmt0(tot.kcal) + ' kcal)')));
      }
      const nq = norm(q);
      const foods = Object.entries(FOODS).filter(([, f]) => !q || parsed.length || norm(f.name).includes(nq)).sort((a, b) => a[1].name.localeCompare(b[1].name, 'it'));
      listBox.replaceChildren(h('p', { class: 'sub', text: 'Tutti gli alimenti' }),
        h('div', { class: 'card' }, foods.length ? foods.map(([id, f]) => {
          const b = h('button', { type: 'button', class: 'pick' }, emo(f.ico), h('span', null, f.name, h('small', { text: 'Porzione da ' + fmt0(f.portion) + ' g, ' + fmt0(f.kcal * f.portion / 100) + ' kcal' })), h('span', { text: 'Aggiungi' }));
          b.addEventListener('click', () => { add(id, f.portion); b.lastChild.textContent = 'Aggiunto'; });
          return b;
        }) : h('p', { class: 'empty', text: 'Nessun alimento con questo nome. Più avanti qui potrai crearlo, anche dalla foto dell’etichetta.' })));
    };
    input.addEventListener('input', draw);
    const quick = h('div', { class: 'quick' }, OFTEN.map((id) => {
      const f = FOODS[id];
      const b = h('button', { type: 'button', 'aria-label': 'Aggiungi ' + f.name + ', ' + fmt0(f.portion) + ' grammi' }, emo(f.ico), SHORT[id] || f.name.split(' ')[0]);
      b.addEventListener('click', () => { add(id, f.portion); b.classList.add('on'); });
      return b;
    }));
    body.append(input, h('p', { class: 'hint', text: 'Puoi scrivere più alimenti in una frase. Le quantità le sistemi dopo con un tocco.' }),
      parsedBox, h('p', { class: 'sub', text: 'I più usati: un tocco e sono nel pasto' }), quick, listBox);
    draw();
  });
}

/* modifica: quantità, porzioni, sostituzioni equivalenti */
function openEdit(mealId, id) {
  const day = getDay(state.date); const meal = findMeal(day, mealId); if (!meal) return;
  const en = meal.items.find((x) => x.id === id); if (!en) return;
  openSheet(FOODS[en.food].ico + ' ' + FOODS[en.food].name, (body) => {
    const draw = () => {
      const f = FOODS[en.food]; const st = stepOf(en.food); const max = Math.max(f.portion * 3, en.g);
      $('#sheetTitle').textContent = f.ico + ' ' + f.name;
      const num = h('div', { class: 'amount__n' });
      const impact = h('div', { class: 'impact', role: 'status' });
      const range = h('input', { type: 'range', min: String(st), max: String(max), step: String(st), value: String(en.g), 'aria-label': 'Quantità in grammi' });
      const paint = () => {
        num.replaceChildren(fmt0(en.g), h('small', { text: ' g' }));
        const v = scale(en.food, en.g); const { tot, tgt } = statusOf(state.date);
        impact.replaceChildren(h('b', { text: fmt0(v.kcal) + ' kcal, ' + fmt1(v.p) + ' g proteine, ' + fmt1(v.c) + ' g carboidrati, ' + fmt1(v.f) + ' g grassi' }),
          h('div', { text: 'Giornata: ' + fmt0(tot.kcal) + ' di ' + fmt0(tgt.kcal) + ' kcal, proteine ' + fmt0(tot.p) + ' di ' + fmt0(tgt.p) + ' g' }));
        range.value = String(en.g);
      };
      const set = (g) => { en.g = roundTo(g, st); paint(); };
      range.addEventListener('input', () => set(Number(range.value)));
      const sw = swapsFor(en);
      body.replaceChildren(
        h('div', { class: 'amount' },
          h('button', { type: 'button', 'aria-label': 'Meno', onclick: () => set(en.g - st) }, icon('minus')), num,
          h('button', { type: 'button', 'aria-label': 'Più', onclick: () => set(en.g + st) }, icon('plus'))),
        range,
        h('div', { class: 'acts' }, [['Mezza porzione', 0.5], ['1 porzione', 1], ['1 e mezza', 1.5], ['2 porzioni', 2]].map(([label, k]) =>
          h('button', { type: 'button', class: 'pill pill--plain', onclick: () => set(f.portion * k) }, label))),
        impact,
        sw.list.length ? h('p', { class: 'sub', text: 'Hai mangiato altro? Sostituisci: ' + lc(sw.label) }) : null,
        sw.list.length ? h('div', { class: 'card' }, sw.list.map((s) => h('button', { type: 'button', class: 'pick', onclick: () => { en.food = s.id; en.g = s.g; draw(); } },
          emo(FOODS[s.id].ico), h('span', null, FOODS[s.id].name, h('small', { text: fmt0(scale(s.id, s.g).kcal) + ' kcal' })), h('span', { text: fmt0(s.g) + ' g' })))) : null,
        h('div', { class: 'acts' }, h('button', { type: 'button', class: 'pill pill--plain pill--wide', onclick: () => { meal.items = meal.items.filter((x) => x.id !== id); closeSheet(); } }, 'Togli dal pasto')));
      paint();
    };
    draw();
  });
}

/* ---------- genera: qui arriverà il menu fatto dall'AI ---------- */
function viewGenera() {
  return h('div', null,
    h('header', { class: 'top' }, h('div', null, h('h1', { text: 'Genera' }), h('p', { text: 'Il menu della settimana' }))),
    h('section', { class: 'hero gen' },
      h('img', { class: 'gen__img', src: 'icon.png', alt: '', width: '88', height: '88' }),
      h('h2', { text: 'Qui nascerà il tuo menu' }),
      h('p', { text: 'Racconterai all’app impegni, attività e gusti della settimana, e l’AI preparerà i pasti giorno per giorno, già in linea con i tuoi obiettivi.' }),
      h('span', { class: 'tag', text: 'In arrivo' })),
    h('p', { class: 'lead', text: 'Intanto trovi un menu di prova nella Giornata e nella Settimana.' }));
}

/* ---------- settimana ---------- */
function viewWeek() {
  const root = h('div'); const t = todayKey();
  root.append(h('header', { class: 'top' }, h('div', null, h('h1', { text: 'Settimana' }), h('p', { text: 'Dal ' + dayMonth(state.week[0]) + ' al ' + dayMonth(state.week[6]) }))));
  const seg = h('div', { class: 'seg', role: 'radiogroup', 'aria-label': 'Cosa vedere' });
  for (const [id, name] of [['piano', 'Piano'], ['spesa', 'Lista della spesa']]) seg.append(h('button', { type: 'button', role: 'radio', 'aria-checked': String(state.weekTab === id), onclick: () => { state.weekTab = id; render(); } }, name));
  root.append(seg);
  if (state.weekTab === 'piano') {
    const card = h('div', { class: 'card' });
    for (const k of state.week) {
      const { day, tot, tgt, perfect } = statusOf(k);
      const names = (id) => { const m = findMeal(day, id); return m && m.items.length ? m.items.slice(0, 2).map((e) => lc(FOODS[e.food].name)).join(', ') : 'vuoto'; };
      card.append(h('button', { type: 'button', class: 'day', onclick: () => { state.date = k; go('oggi'); } },
        h('span', { class: 'ico', 'aria-hidden': 'true', text: day.acts.length ? ACT[day.acts[0].id].ico : '🛋️' }),
        h('span', null, h('span', { class: 'day__name', text: weekdayName(k) + ' ' + dateOf(k).getDate() + (k === t ? ', oggi' : '') }), ' ',
          h('span', { class: 'day__type', text: actsLabel(day) })),
        h('span', { class: 'day__kcal' }, h('b', { text: (perfect ? '⭐ ' : '') + fmt0(tot.kcal) }), 'di ' + fmt0(tgt.kcal)),
        h('span', { class: 'day__prev', text: 'Pranzo: ' + names('pranzo') + '. Cena: ' + names('cena') + '.' })));
    }
    root.append(h('section', { class: 'sect' }, card),
      h('p', { class: 'lead', text: 'Tocca un giorno per aprirlo.' }),
      h('div', { class: 'acts' }, h('button', { type: 'button', class: 'pill', onclick: () => go('genera') }, '✨ Genera un nuovo menu')));
  } else {
    const tot = {};
    for (const k of state.week) for (const e of allItems(getDay(k))) tot[e.food] = (tot[e.food] || 0) + e.g;
    const card = h('div', { class: 'card' });
    for (const [id, g] of Object.entries(tot).sort((a, b) => FOODS[a[0]].name.localeCompare(FOODS[b[0]].name, 'it'))) {
      const box = h('input', { type: 'checkbox', checked: !!state.bought[id] });
      box.addEventListener('change', () => { state.bought[id] = box.checked; });
      card.append(h('label', { class: 'buy' }, box, emo(FOODS[id].ico), h('span', { text: FOODS[id].name }), h('span', { text: g >= 1000 ? fmt1(g / 1000) + ' kg' : fmt0(g) + ' g' })));
    }
    root.append(h('section', { class: 'sect' }, card), h('p', { class: 'lead', text: 'Le quantità sono la somma dei sette giorni del piano.' }));
  }
  return root;
}

/* ---------- avvio ---------- */
$('#fab').addEventListener('click', () => {
  runAnalysis();
  const c = $('#consigli'); if (c) c.scrollIntoView({ behavior: 'smooth', block: 'start' });
});
buildWeek(DEFAULT_PLAN);
window.addEventListener('hashchange', () => { render(); window.scrollTo(0, 0); });
render();
})();
