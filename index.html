<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https://api.github.com; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>Weekly Menu</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Weekly Menu">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#EFE6D6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1D1612" media="(prefers-color-scheme: dark)">
<style>
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none !important}
:root{
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
  /* palette chiara */
  --bg:#EFE6D6; --card:#FBF7F0; --text:#2B1F16; --text2:#6B5747; --line:#DDCFBB;
  --pri:#6F4A2E; --pri-ink:#FBF7F0; --pri-soft:rgba(111,74,46,.13);
  --fill:rgba(43,31,22,.07); --fill2:rgba(43,31,22,.16);
  --over:#9C3D10; --over-soft:rgba(156,61,16,.11);
  /* macro: il colore accompagna sempre il nome */
  --m-kcal:#6F4A2E; --m-p:#A23B2A; --m-c:#8A5E00; --m-g:#355F80; --m-f:#3B6F37;
  --glass:rgba(239,230,214,.95); --glass-line:#DDCFBB; --glass-shadow:0 12px 32px rgba(43,31,22,.18);
  /* scala per gli spaccati, dal più scuro al più chiaro */
  --r0:#2B1F16; --r1:#4A3423; --r2:#6F4A2E; --r3:#8A6446; --r4:#A37E5F; --r5:#B9997C; --r6:#C9AF93; --r7:#D6C3AA; --r8:#DDCFBB; --r9:#E7DCCB;
  --blur:blur(20px) saturate(140%);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#1D1612; --card:#2A211B; --text:#F2E8DC; --text2:#C4B3A1; --line:#3A2E25;
    --pri:#D4A373; --pri-ink:#1D1612; --pri-soft:rgba(212,163,115,.16);
    --fill:rgba(242,232,220,.07); --fill2:rgba(242,232,220,.16);
    --over:#F2A57E; --over-soft:rgba(242,165,126,.14);
    --m-kcal:#D4A373; --m-p:#E8907E; --m-c:#E0B354; --m-g:#8DB6D6; --m-f:#93C38A;
    --glass:rgba(29,22,18,.95); --glass-line:#3A2E25; --glass-shadow:0 12px 32px rgba(0,0,0,.5);
    --r0:#F2E8DC; --r1:#E3CFB5; --r2:#D4A373; --r3:#BF8D5E; --r4:#A9784C; --r5:#8E6340; --r6:#735036; --r7:#5C412D; --r8:#4A3526; --r9:#3A2E25;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#1D1612; --card:#2A211B; --text:#F2E8DC; --text2:#C4B3A1; --line:#3A2E25;
  --pri:#D4A373; --pri-ink:#1D1612; --pri-soft:rgba(212,163,115,.16);
  --fill:rgba(242,232,220,.07); --fill2:rgba(242,232,220,.16);
  --over:#F2A57E; --over-soft:rgba(242,165,126,.14);
  --m-kcal:#D4A373; --m-p:#E8907E; --m-c:#E0B354; --m-g:#8DB6D6; --m-f:#93C38A;
  --glass:rgba(29,22,18,.95); --glass-line:#3A2E25; --glass-shadow:0 12px 32px rgba(0,0,0,.5);
  --r0:#F2E8DC; --r1:#E3CFB5; --r2:#D4A373; --r3:#BF8D5E; --r4:#A9784C; --r5:#8E6340; --r6:#735036; --r7:#5C412D; --r8:#4A3526; --r9:#3A2E25;
}

html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font:400 17px/1.35 ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:11;background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
h1,h2,h3,p,ul{margin:0}
ul{padding:0;list-style:none}
button,input,select,textarea{font-family:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent;color:inherit}
a{color:var(--pri);font-weight:700}
:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
main{max-width:560px;margin:0 auto;padding:6px 16px 128px}
.emo{line-height:1}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:8px}
.top h1{font-size:32px;font-weight:800;letter-spacing:-0.02em;line-height:1.1}
.top p{margin-top:2px;color:var(--text2);font-size:16px}

/* il nome del macro con il suo colore */
.mt{display:inline-flex;align-items:center;gap:6px;color:var(--mc);font-weight:800}
.mt i{flex:none;width:10px;height:10px;border-radius:3px;background:var(--mc)}

/* miniature degli alimenti */
.th{display:block;flex:none;width:40px;height:40px;border-radius:12px;object-fit:cover;background:var(--card);box-shadow:inset 0 0 0 1px var(--line)}
.th--ini{display:grid;place-items:center;background:var(--fill);box-shadow:inset 0 0 0 1px var(--line);color:var(--text2);font-size:17px;font-weight:800}
.th--emo{display:grid;place-items:center;background:var(--fill);box-shadow:none;font-size:20px}
.th--l{width:48px;height:48px;border-radius:14px}
.th--xl{width:72px;height:72px;border-radius:18px;font-size:28px}

/* settimana in una riga */
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:14px}
.sd{display:grid;justify-items:center;gap:4px;padding:6px 0 8px;border:0;border-radius:16px;background:none;font-size:14px;font-weight:700;color:var(--text2)}
.sd__n{display:grid;place-items:center;width:36px;height:36px;border-radius:50%;border:2px solid var(--fill2);color:var(--text);font-size:16px;font-weight:800}
.sd.perfect .sd__n{border-color:var(--pri);background:var(--pri);color:var(--pri-ink)}
.sd.partial .sd__n{border-color:var(--over);border-style:dashed}
.sd[aria-pressed="true"]{background:var(--card);color:var(--text);box-shadow:inset 0 0 0 1px var(--line)}

/* tipo di giornata */
.actc{display:grid;grid-template-columns:auto minmax(0,1fr) 18px;align-items:center;gap:12px;width:100%;margin-top:12px;padding:12px 14px;border:0;border-radius:22px;background:var(--card);text-align:left;font-size:17px}
.actc__ico{display:flex}
.actc__ico span{display:grid;place-items:center;width:42px;height:42px;border-radius:50%;background:var(--pri-soft);font-size:22px;line-height:1}
.actc b{display:block;font-weight:800;overflow-wrap:anywhere}
.actc small{display:block;margin-top:2px;color:var(--text2);font-size:15px}
.actc > svg{width:18px;height:18px;color:var(--text2)}

/* riepilogo a schede */
.car{margin-top:12px}
.car__track{display:grid;grid-auto-flow:column;grid-auto-columns:100%;gap:0;overflow-x:auto;scroll-snap-type:x mandatory;overscroll-behavior-x:contain;scrollbar-width:none;border-radius:26px}
.car__track::-webkit-scrollbar{display:none}
.scheda{scroll-snap-align:start;display:grid;gap:8px;margin:0;padding:14px 16px 14px;border:0;border-radius:26px;background:var(--card);text-align:left;font-size:17px}
.scheda__k{font-size:17px}
.gauge{position:relative;display:block;max-width:250px;width:100%;margin:0 auto}
.gauge svg{display:block;width:100%}
.g-bg,.g-fg,.g-band{fill:none;stroke-width:16;stroke-linecap:round}
.g-bg{stroke:var(--fill2)}
/* la fascia è l'intervallo dell'obiettivo; la linea piena è il valore */
.g-band{stroke:var(--mc);stroke-opacity:.45;stroke-linecap:butt}
.g-fg{stroke:var(--mc);stroke-width:8;transition:stroke-dasharray .35s ease}
.scheda--lontano .g-fg{stroke:var(--over)}
.gauge__mid{position:absolute;left:24px;right:24px;bottom:0;display:grid;justify-items:center;text-align:center}
.gauge__n{font-size:42px;font-weight:800;letter-spacing:-0.02em;line-height:1}
.gauge__l{margin-top:2px;color:var(--text2);font-size:15px;font-weight:700;line-height:1.2}
.scheda__row{display:flex;justify-content:space-between;gap:12px;color:var(--text2);font-size:15px}
.scheda__row b{display:block;color:var(--text);font-size:17px;font-weight:800}
.scheda__row span:last-child{text-align:right}
.scheda__stato{display:flex;align-items:center;justify-content:center;min-height:38px;padding:4px 12px;border-radius:999px;background:var(--fill);color:var(--text);font-size:15px;font-weight:700;text-align:center}
.scheda__stato--vicino{background:var(--pri-soft)}
.scheda__stato--lontano{background:var(--over-soft);color:var(--over)}
.dots{display:flex;justify-content:center;gap:4px;margin-top:6px}
.dot{width:32px;height:32px;padding:0;border:0;background:none;display:grid;place-items:center}
.dot::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--fill2);transition:width .2s}
.dot[aria-current="true"]::before{width:22px;border-radius:5px;background:var(--mc)}

/* riga compatta in alto, quando le schede escono dallo schermo */
.barra{position:fixed;left:0;right:0;top:0;z-index:15;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;width:100%;padding:calc(6px + env(safe-area-inset-top,0px)) max(12px,calc(50% - 268px)) 8px;border:0;border-bottom:1px solid var(--glass-line);background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);text-align:left;transform:translateY(-110%);transition:transform .2s ease;pointer-events:none}
.barra.su{transform:none;pointer-events:auto}
.barra__c{display:grid;gap:1px;min-width:0}
.barra__c .mt{font-size:14px;white-space:nowrap;overflow:hidden}
.barra__c .mt i{width:8px;height:8px}
.barra__c b{font-size:16px;font-weight:800}
.barra__c--lontano b{color:var(--over)}
.barra__s{font-weight:800}

/* pasti */
.meal{margin-top:14px;padding:6px 12px 8px;border-radius:22px;background:var(--card)}
.meal__head{display:grid;grid-template-columns:minmax(0,1fr) 44px 44px;align-items:center;gap:8px;min-height:60px}
.meal__head--2{grid-template-columns:minmax(0,1fr) 44px}
.meal__open{display:grid;grid-template-columns:44px minmax(0,1fr);align-items:center;gap:10px;min-height:56px;padding:0;border:0;border-radius:14px;background:none;text-align:left;font-size:17px}
.meal__name{display:block;font-size:18px;font-weight:800;line-height:1.15;overflow-wrap:anywhere}
.meal__sum{display:block;color:var(--text2);font-size:15px}
.check{display:grid;place-items:center;width:44px;height:44px;padding:0;border:2px solid var(--fill2);border-radius:50%;background:none;color:var(--text2)}
.check svg{width:18px;height:18px;opacity:.6}
.check[aria-pressed="true"]{border-color:var(--pri);background:var(--pri);color:var(--pri-ink)}
.check[aria-pressed="true"] svg{opacity:1}
.meal.eaten .ico{background:var(--pri-soft)}
.ico{display:grid;place-items:center;width:44px;height:44px;border-radius:14px;background:var(--fill);font-size:24px;line-height:1}
.plus{width:44px;height:44px;border:0;border-radius:50%;background:var(--pri);color:var(--pri-ink);display:grid;place-items:center}
.plus svg{width:20px;height:20px}
.food{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:8px;min-height:60px;border-top:1px solid var(--line)}
.food__main{display:grid;grid-template-columns:36px minmax(0,1fr);align-items:center;gap:10px;min-height:58px;padding:0;border:0;background:none;text-align:left;font-size:17px}
.food__main b{display:block;font-weight:700;overflow-wrap:anywhere}
.food__main small{display:block;color:var(--text2);font-size:14px}
.qty{display:inline-grid;grid-template-columns:34px auto 34px;align-items:center;border-radius:999px;background:var(--fill)}
.qty button{height:42px;border:0;background:none;font-size:16px;font-weight:800}
.qty button svg{width:14px;height:14px;display:block;margin:0 auto}
.qty__v{min-width:52px;padding:0 2px}
.food .th{width:36px;height:36px;border-radius:11px}
.empty{padding:10px 0 6px;border-top:1px solid var(--line);color:var(--text2);font-size:16px}
.meal__alt{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0 2px;border-top:1px solid var(--line);color:var(--text2);font-size:15px;font-weight:700}
.meal__alt .pill{display:inline-flex;align-items:center;gap:6px}
.meal__alt .pill svg{width:18px;height:18px}
.libero{display:grid;gap:4px;width:100%;padding:10px 0 6px;border:0;border-top:1px solid var(--line);background:none;text-align:left;font-size:17px}
.libero__d{font-weight:700}
.libero__s{color:var(--text2);font-size:15px}
.tag{justify-self:start;display:inline-block;padding:3px 10px;border-radius:999px;background:var(--pri-soft);color:var(--pri);font-size:14px;font-weight:800}

/* consigli e pulsanti */
.sect{margin-top:22px}
.sect--s{margin-top:12px}
.sect__head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:0 4px 8px}
.sect__head h2{font-size:21px;font-weight:800}
.card{border-radius:22px;background:var(--card);padding:4px 14px}
.card > :last-child{border-bottom:0}
.coach{padding:14px}
.coach__msg{font-weight:700}
.coach__sub{margin-top:8px;color:var(--text2);font-size:16px}
.coach__after{margin-top:12px;padding:10px 12px;border-radius:14px;background:var(--fill);font-size:16px}
.sugg{display:grid;grid-template-columns:40px minmax(0,1fr) auto;align-items:center;gap:10px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.sugg__t b{display:block;font-weight:700}
.sugg__d{display:block;margin-top:2px;color:var(--text2);font-size:15px}
.effs{display:flex;flex-wrap:wrap;gap:2px 12px;margin-top:4px;font-size:15px}
.eff{white-space:nowrap}
.eff .mt{font-weight:800}
.pill{min-height:44px;padding:0 18px;border:0;border-radius:999px;background:var(--pri);color:var(--pri-ink);font-size:16px;font-weight:700}
.pill[disabled]{background:var(--fill);color:var(--text2);cursor:default}
.pill--soft{background:var(--pri-soft);color:var(--pri)}
.pill--plain{background:var(--fill);color:var(--text)}
.pill--plain[aria-pressed="true"]{background:var(--pri);color:var(--pri-ink)}
.pill--wide{width:100%;min-height:50px;font-size:17px}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.acts--0{margin-top:0}
.lead{margin-top:10px;padding:0 4px;color:var(--text2);font-size:16px}
.lead--top{margin:0 0 10px}
.textbtn{min-height:44px;padding:0 4px;border:0;background:none;color:var(--pri);font-size:17px;font-weight:800}
.textbtn--sm{font-size:15px}

/* settimana */
.wnav{display:grid;grid-template-columns:44px minmax(0,1fr) 44px;align-items:center;gap:8px;margin-top:14px}
.wnav .round{width:44px;height:44px}
.wnav__t{text-align:center}
.wnav__t b{display:block;font-size:18px;font-weight:800}
.wnav__t small{display:block;color:var(--text2);font-size:15px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:2px;margin-top:12px;padding:3px;border-radius:14px;background:var(--fill)}
.seg button{min-height:42px;border:0;border-radius:11px;background:transparent;font-size:16px;font-weight:700}
.seg button[aria-checked="true"]{background:var(--card);box-shadow:0 1px 4px rgba(43,31,22,.18)}
.day{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:4px 10px;align-items:center;width:100%;min-height:74px;padding:12px 0;border:0;border-bottom:1px solid var(--line);background:none;font-size:17px;text-align:left}
.day .ico{grid-row:1 / span 2}
.day__n{min-width:0}
.day__name{display:block;font-weight:800}
.day__type{display:block;color:var(--text2);font-size:15px;font-weight:700}
.day__kcal{text-align:right;font-size:14px;color:var(--text2)}
.day__kcal b{display:block;color:var(--text);font-size:17px}
.day__st{grid-column:2 / -1;font-size:15px;font-weight:700;color:var(--text2)}
.day__st--fuori{color:var(--over)}
.day--fuori .ico{background:var(--over-soft)}
.prep{margin-top:10px;padding:12px 14px}
.prep__t{font-size:17px}
.prep__p{margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.prep__n{font-size:18px;font-weight:800}
.sub--in{margin:10px 0 4px}
.schisc li{padding:8px 0;border-bottom:1px solid var(--line)}
.schisc li:last-child{border-bottom:0}
.schisc b{display:block;font-weight:800}
.schisc span{display:block;color:var(--text2);font-size:15px}
.schisc li.fatto b,.schisc li.fatto span{text-decoration:line-through}

/* lista della spesa */
.addrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center}
.addrow .pill{min-height:52px}
.buy{display:grid;grid-template-columns:32px minmax(0,1fr);align-items:center;gap:8px;min-height:54px;border-bottom:1px solid var(--line)}
.buy input{width:24px;height:24px;margin:0;accent-color:var(--pri)}
.buy__t{display:grid;gap:2px;min-height:52px;padding:6px 0;border:0;background:none;text-align:left;font-size:17px;align-content:center}
.buy__t small{color:var(--text2);font-size:14px;font-weight:700}
.buy--fatta .buy__t span{text-decoration:line-through;color:var(--text2)}

/* alimenti */
.alim{grid-template-columns:40px minmax(0,1fr) auto}
.alim__r{max-width:96px;color:var(--text2) !important;font-size:14px !important;font-weight:700 !important;text-align:right}

/* spaccati */
.bo-list{padding:4px 6px}
.bo{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:baseline;gap:6px 10px;width:100%;padding:10px 8px;border:0;border-radius:14px;background:none;text-align:left;font-size:17px}
.bo[aria-pressed="true"]{background:var(--fill)}
.bo__v{font-weight:800;white-space:nowrap}
.bo__v small{color:var(--text2);font-size:14px;font-weight:600}
.stack{grid-column:1 / -1;position:relative;display:flex;height:12px;border-radius:6px;background:var(--fill);overflow:hidden}
.stack i{display:block;height:100%;border-right:2px solid var(--card)}
.stack__band{position:absolute;top:0;bottom:0;border:2px solid var(--text);border-radius:5px}
.br{display:grid;grid-template-columns:10px 40px minmax(0,1fr) auto;align-items:center;gap:6px 10px;width:100%;padding:10px 0;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;font-size:17px}
.br__dot{width:10px;height:10px;border-radius:50%}
.br__n{min-width:0}
.br__n b{display:block;font-weight:700;overflow-wrap:anywhere}
.br__n small,.br__v small{display:block;color:var(--text2);font-size:14px}
.br__v{text-align:right;white-space:nowrap}
.br__v b{font-weight:800}
.br__bar{grid-column:3 / -1;height:6px;border-radius:3px;background:var(--fill);overflow:hidden}
.br__bar i{display:block;height:100%;border-radius:3px}

/* dock a vetro, con un fondo quasi pieno */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;padding:0 12px calc(10px + env(safe-area-inset-bottom,0px));pointer-events:none}
.dock__in{pointer-events:auto;display:grid;grid-template-columns:repeat(4,1fr);gap:2px;width:100%;max-width:420px;padding:6px;border-radius:32px;background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--glass-line);box-shadow:var(--glass-shadow)}
.dock a{display:grid;justify-items:center;align-content:center;gap:2px;min-height:58px;padding:6px 2px;border-radius:26px;color:var(--text2);font-size:14px;font-weight:700;text-decoration:none}
.dock a svg{width:24px;height:24px}
.dock a[aria-current="page"]{background:var(--pri-soft);color:var(--pri)}
.dock a.mid span{display:grid;place-items:center;width:46px;height:28px;border-radius:14px;background:var(--pri);color:var(--pri-ink)}
.dock a.mid svg{width:19px;height:19px}

/* pannello dal basso */
dialog.sheet{position:fixed;inset:auto 0 0 0;width:100%;max-width:560px;max-height:90%;margin:0 auto;padding:0;border:0;border-radius:26px 26px 0 0;background:var(--bg);color:var(--text);overflow:auto;overscroll-behavior:contain}
dialog.sheet:not([open]){display:none}
dialog::backdrop{background:rgba(29,22,18,.5)}
.sheet__head{position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px 10px;background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border-bottom:1px solid var(--glass-line)}
.sheet__head h2{font-size:20px;font-weight:800}
.sheet__head h2:focus{outline:none}
.sheet__body{padding:8px 16px calc(26px + env(safe-area-inset-bottom,0px))}
.field{display:block;width:100%;height:52px;padding:0 16px;border:2px solid var(--line);border-radius:16px;background:var(--card);color:var(--text);font-size:17px;-webkit-appearance:none;appearance:none}
.field:focus{border-color:var(--pri);outline:none}
.field::placeholder{color:var(--text2);opacity:1}
.field:disabled{opacity:.7}
.field--num{width:110px;height:46px;padding:0 10px;text-align:right}
.field[aria-invalid="true"]{border-color:var(--over)}
select.field{padding-right:12px}
.area{height:auto;min-height:180px;padding:12px 14px;font:15px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;resize:vertical}
.hint{margin-top:8px;padding:0 4px;color:var(--text2);font-size:15px}
.sub{margin:18px 4px 8px;font-size:16px;font-weight:800;color:var(--text2)}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.quick--3{grid-template-columns:repeat(3,1fr);margin-top:12px}
.quick button{display:grid;justify-items:center;align-content:start;gap:6px;min-height:96px;padding:10px 4px 8px;border:2px solid transparent;border-radius:18px;background:var(--card);font-size:14px;font-weight:700;line-height:1.15;text-align:center}
.quick button .emo{font-size:28px}
.quick button.on{border-color:var(--pri);background:var(--pri-soft)}
.quick__n{overflow-wrap:anywhere}
.acts-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.acts-grid button{display:grid;justify-items:center;align-content:center;gap:6px;min-height:88px;padding:10px 4px;border:2px solid transparent;border-radius:18px;background:var(--card);font-size:16px;font-weight:700;line-height:1.15;text-align:center}
.acts-grid button .emo{font-size:30px}
.acts-grid button[aria-checked="true"]{border-color:var(--pri);background:var(--pri-soft)}
.switch{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:12px;width:100%;margin-top:12px;padding:12px 14px;border:0;border-radius:18px;background:var(--card);text-align:left;font-size:17px}
.switch b{display:block;font-weight:800}
.switch small{display:block;margin-top:2px;color:var(--text2);font-size:15px}
.switch__t{position:relative;width:52px;height:32px;border-radius:999px;background:var(--fill2);transition:background .2s}
.switch__t::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
.switch[aria-checked="true"] .switch__t{background:var(--pri)}
.switch[aria-checked="true"] .switch__t::after{transform:translateX(20px)}
.pick{display:grid;grid-template-columns:40px minmax(0,1fr) auto;align-items:center;gap:10px;width:100%;min-height:60px;padding:6px 0;border:0;border-bottom:1px solid var(--line);background:none;font-size:17px;text-align:left}
.pick small{display:block;color:var(--text2);font-size:14px}
.pick > span:last-child{color:var(--pri);font-size:15px;font-weight:800}
.pick--ro > span:last-child{color:var(--text2)}
.amount{display:grid;grid-template-columns:56px 1fr 56px;align-items:center;gap:10px;margin-top:8px}
.amount button{width:56px;height:56px;border:0;border-radius:50%;background:var(--card);display:grid;place-items:center}
.amount button svg{width:22px;height:22px}
.amount__n{text-align:center;font-size:44px;font-weight:800;letter-spacing:-0.02em;line-height:1}
.amount__n small{font-size:20px;color:var(--text2)}
.edit__head{display:flex;align-items:center;gap:12px;margin-top:4px}
.edit__head .hint{margin:0}
.foto__az{display:grid;justify-items:start;gap:4px}
input[type="range"]{width:100%;margin:16px 0 4px;accent-color:var(--pri)}
.impact{margin-top:12px;padding:12px 14px;border-radius:16px;background:var(--card);font-size:16px}
.impact b{font-weight:800}
.impact__g{margin-top:6px;color:var(--text2);font-size:15px}
.stima{padding:2px 14px}
.stima__r{display:grid;grid-template-columns:minmax(0,1fr) auto 36px;align-items:center;gap:10px;min-height:58px;border-bottom:1px solid var(--line);font-size:17px}
.stima__r:last-child{border-bottom:0}
.stima__r > span:last-child{color:var(--text2);font-size:15px}
/* intervalli degli obiettivi: «da … a …» */
.iv__r{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:17px}
.iv__r:last-child{border-bottom:0}
.iv__f{display:flex;align-items:center;gap:6px;margin-left:auto;color:var(--text2);font-size:16px}
.iv__f .field--num{width:86px;color:var(--text)}
.iv__u{min-width:30px}

/* alternative */
.alt{margin-top:12px;padding:12px 14px}
.alt--ora{box-shadow:inset 0 0 0 2px var(--pri)}
.alt__t{font-weight:800;margin-bottom:4px}
.alt__v{display:grid;grid-template-columns:40px minmax(0,1fr) auto;align-items:center;gap:10px;min-height:50px}
.alt__v b{font-weight:800}

/* importa */
.riep{margin-top:18px}
.riep__h{padding:0 4px;font-size:21px;font-weight:800}
.elenco{margin:6px 0 0;padding-left:20px;list-style:disc;font-size:16px}
.elenco li{margin-top:6px}
.info--err{background:var(--over-soft)}
.info--err .info__t{color:var(--over)}
.dom{padding:12px 0;border-bottom:1px solid var(--line)}
.dom__t{display:grid;grid-template-columns:40px minmax(0,1fr);align-items:center;gap:10px;font-weight:700}
.rg{display:grid;grid-template-columns:44px minmax(0,1fr) auto;align-items:center;gap:10px;min-height:64px;padding:8px 0;border-bottom:1px solid var(--line)}
.rg__n b{display:block;font-weight:800}
.rg__n small{display:block;color:var(--text2);font-size:14px}
.rg__k{display:grid;justify-items:end;text-align:right;font-weight:800;font-size:16px}
.rg__k small{max-width:150px;color:var(--text2);font-size:14px;font-weight:700}
.rg__k--fuori small{color:var(--over)}
.nv{display:grid;grid-template-columns:40px minmax(0,1fr);gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.nv__t b{display:block;font-weight:800}
.nv__t small{display:block;margin-top:2px;color:var(--text2);font-size:14px}

/* stato del salvataggio, impostazioni, conflitti */
.top__l{min-width:0}
.top__r{display:flex;align-items:center;gap:8px;flex:none}
.sync{display:inline-flex;align-items:center;gap:6px;max-width:176px;min-height:40px;padding:0 12px;border:0;border-radius:999px;background:var(--card);color:var(--text);font-size:14px;font-weight:800;white-space:nowrap}
.sync__t{overflow:hidden;text-overflow:ellipsis}
.sync--salvato .sync__i{color:var(--pri)}
.sync--errore,.sync--conflitti,.sync--scelta,.sync--aggiorna{background:var(--over-soft);color:var(--over)}
.round{display:grid;place-items:center;flex:none;width:44px;height:44px;border:0;border-radius:50%;background:var(--card);color:var(--text)}
.round svg{width:20px;height:20px}
.info{padding:12px 14px}
.info__t{font-weight:800}
.info .acts{margin-top:10px}
.vuoto{margin-top:14px}
.conf{padding:12px 0;border-bottom:1px solid var(--line)}
.conf b{display:block;font-weight:800}
.conf__v{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.conf__v .pill{display:grid;align-content:center;gap:2px;min-height:58px;padding:6px 12px;border-radius:16px;text-align:left;font-size:15px}
.conf__v .pill small{font-size:14px;font-weight:700;opacity:.85}
details.aiuto{margin-top:14px;padding:12px 14px;border-radius:16px;background:var(--card)}
details.aiuto summary{font-weight:800;cursor:pointer}
details.aiuto ol{margin:8px 0 0;padding-left:20px;color:var(--text2);font-size:16px}
details.aiuto li{margin-top:6px}
.avviso{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));z-index:30;transform:translateX(-50%);width:max-content;max-width:calc(100% - 32px);padding:10px 16px;border-radius:16px;background:var(--text);color:var(--bg);font-size:16px;font-weight:700;box-shadow:var(--glass-shadow)}

@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important;scroll-behavior:auto !important}}
</style>
</head>
<body>

<main id="main"><div id="view"></div></main>

<div class="avviso" id="avviso" role="status" hidden></div>

<nav class="dock" aria-label="Sezioni">
  <div class="dock__in">
    <a href="#oggi" data-tab="oggi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 13a8 8 0 0 1 16 0"/><path d="M3 17h18M12 13l3.5-3.5"/></svg>Giornata</a>
    <a href="#importa" data-tab="importa" class="mid"><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7.5 10.5L12 15l4.5-4.5"/><path d="M5 19h14"/></svg></span>Importa</a>
    <a href="#settimana" data-tab="settimana"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="3.5"/><path d="M4 10h16M8.5 3v4M15.5 3v4"/></svg>Settimana</a>
    <a href="#alimenti" data-tab="alimenti"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 6.5c-1.5-2-4.5-2.2-6-.5-1.8 2-1.3 6 1 9.5 1.3 2 2.8 3.5 5 3.5s3.7-1.5 5-3.5c2.3-3.5 2.8-7.5 1-9.5-1.5-1.7-4.5-1.5-6 .5z"/><path d="M12 6.5c0-2 1-3.5 2.5-4"/></svg>Alimenti</a>
  </div>
</nav>

<dialog class="sheet" id="sheet" aria-labelledby="sheetTitle">
  <div class="sheet__head"><h2 id="sheetTitle" tabindex="-1"></h2><button type="button" class="textbtn" id="sheetClose">Fine</button></div>
  <div class="sheet__body" id="sheetBody"></div>
</dialog>

<script src="archivio.js"></script>
<script src="piano.js"></script>
<script src="app.js"></script>
</body>
</html>
