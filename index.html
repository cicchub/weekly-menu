<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Weekly Menu</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Weekly Menu">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#F4F3FA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E0D1A" media="(prefers-color-scheme: dark)">
<style>
*,*::before,*::after{box-sizing:border-box}
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
  --bg:#F4F3FA; --card:#FFFFFF; --text:#17153B; --text2:#5F5C7C; --sep:rgba(23,21,59,.10);
  --pri:#5B4BFF; --pri-ink:#FFFFFF; --pri-soft:rgba(91,75,255,.12);
  --fill:rgba(23,21,59,.06); --fill2:rgba(23,21,59,.13);
  --glass:rgba(255,255,255,.68); --glass-line:rgba(255,255,255,.8); --glass-shadow:0 12px 32px rgba(23,21,59,.18);
  --pro:#E0406A; --carb:#C97F00; --fat:#1E90CC; --fib:#1C9A63; --flame:#F2601F; --ok:#16794D; --warn:#A8500A;
  --blur:blur(24px) saturate(180%);
}
:root[data-accent="corallo"]{--pri:#D93B27;--pri-soft:rgba(217,59,39,.12)}
:root[data-accent="menta"]{--pri:#0A8163;--pri-soft:rgba(10,129,99,.13)}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0E0D1A; --card:#1B1A2E; --text:#F2F1FF; --text2:#ABA8CC; --sep:rgba(255,255,255,.10);
    --pri:#9A91FF; --pri-ink:#0E0D1A; --pri-soft:rgba(154,145,255,.2);
    --fill:rgba(255,255,255,.08); --fill2:rgba(255,255,255,.17);
    --glass:rgba(27,26,46,.64); --glass-line:rgba(255,255,255,.14); --glass-shadow:0 12px 32px rgba(0,0,0,.55);
    --pro:#FF7C9B; --carb:#FFB84A; --fat:#5CC4F5; --fib:#56D79B; --flame:#FF8A4C; --ok:#56D79B; --warn:#FFB84A;
  }
  :root:not([data-theme="light"])[data-accent="corallo"]{--pri:#FF8E7C;--pri-soft:rgba(255,142,124,.2)}
  :root:not([data-theme="light"])[data-accent="menta"]{--pri:#4FD8AE;--pri-soft:rgba(79,216,174,.2)}
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E0D1A; --card:#1B1A2E; --text:#F2F1FF; --text2:#ABA8CC; --sep:rgba(255,255,255,.10);
  --pri:#9A91FF; --pri-ink:#0E0D1A; --pri-soft:rgba(154,145,255,.2);
  --fill:rgba(255,255,255,.08); --fill2:rgba(255,255,255,.17);
  --glass:rgba(27,26,46,.64); --glass-line:rgba(255,255,255,.14); --glass-shadow:0 12px 32px rgba(0,0,0,.55);
  --pro:#FF7C9B; --carb:#FFB84A; --fat:#5CC4F5; --fib:#56D79B; --flame:#FF8A4C; --ok:#56D79B; --warn:#FFB84A;
}
:root[data-theme="dark"][data-accent="corallo"]{--pri:#FF8E7C;--pri-soft:rgba(255,142,124,.2)}
:root[data-theme="dark"][data-accent="menta"]{--pri:#4FD8AE;--pri-soft:rgba(79,216,174,.2)}

html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font:400 17px/1.3 ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:11;background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
h1,h2,h3,p,ul{margin:0}
ul{padding:0;list-style:none}
button,input{font-family:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent;color:inherit}
:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
main{max-width:560px;margin:0 auto;padding:6px 16px 128px}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:8px}
.top h1{font-size:34px;font-weight:800;letter-spacing:-0.02em;line-height:1.1}
.top p{margin-top:2px;color:var(--text2);font-size:15px}
.top__r{display:flex;align-items:center;gap:8px}
.streak{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border:0;border-radius:999px;background:var(--card);font-size:17px;font-weight:800}
.streak.off{color:var(--text2)}
.streak.off .emo{filter:grayscale(1);opacity:.6}
.round{width:40px;height:40px;border:0;border-radius:50%;background:var(--card);display:grid;place-items:center}
.round svg{width:20px;height:20px}

/* settimana in una riga */
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:14px}
.sd{display:grid;justify-items:center;gap:4px;padding:6px 0 8px;border:0;border-radius:16px;background:none;font-size:12px;font-weight:700;color:var(--text2)}
.sd__n{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;border:2px solid var(--fill2);color:var(--text);font-size:15px;font-weight:800}
.sd.perfect .sd__n{border-color:var(--pri);background:var(--pri);color:var(--pri-ink)}
.sd.partial .sd__n{border-color:var(--pri)}
.sd[aria-pressed="true"]{background:var(--card);color:var(--text)}

/* riepilogo */
.hero{margin-top:12px;padding:16px 16px 14px;border-radius:26px;background:var(--card)}
.gauge{position:relative;max-width:260px;margin:0 auto}
.gauge svg{display:block;width:100%}
.g-bg,.g-fg{fill:none;stroke-width:16;stroke-linecap:round}
.g-bg{stroke:var(--fill2)}
.g-fg{stroke:var(--pri);transition:stroke-dasharray .35s ease,stroke .2s}
.gauge.over .g-fg{stroke:var(--flame)}
.gauge__mid{position:absolute;left:0;right:0;bottom:0;text-align:center}
.gauge__n{font-size:44px;font-weight:800;letter-spacing:-0.02em;line-height:1}
.gauge__l{margin-top:2px;color:var(--text2);font-size:14px;font-weight:600}
.hero__row{display:flex;justify-content:space-between;gap:12px;margin-top:12px;color:var(--text2);font-size:14px}
.hero__row b{display:block;color:var(--text);font-size:17px;font-weight:800}
.hero__row div:last-child{text-align:right}
.state{display:flex;align-items:center;justify-content:center;gap:6px;min-height:36px;margin-top:12px;border-radius:999px;background:var(--fill);color:var(--text2);font-size:15px;font-weight:700}
.state.win{background:var(--pri-soft);color:var(--pri)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:2px;margin-top:12px;padding:3px;border-radius:14px;background:var(--fill)}
.seg button{min-height:36px;border:0;border-radius:11px;background:transparent;font-size:15px;font-weight:700}
.seg button[aria-checked="true"]{background:var(--card);box-shadow:0 1px 4px rgba(23,21,59,.16)}

/* riga dei macro: resta bloccata in alto mentre scorri */
.macro{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;margin:10px -16px 0;padding:9px 16px 10px;background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border-bottom:1px solid var(--sep)}
.mrow{display:grid;grid-template-columns:1.15fr repeat(4,1fr);gap:10px;max-width:528px;margin:0 auto}
.mc__k{display:block;color:var(--text2);font-size:12px;font-weight:700}
.mc__v{display:block;font-size:15px;font-weight:800;white-space:nowrap}
.mc__v small{color:var(--text2);font-size:12px;font-weight:600}
.mc__b{display:block;height:5px;margin-top:4px;border-radius:3px;background:var(--fill2);overflow:hidden}
.mc__b i{display:block;height:100%;width:0;border-radius:3px;background:var(--c);transition:width .3s ease}

/* pasti */
.meal{margin-top:14px;padding:6px 14px 8px;border-radius:22px;background:var(--card)}
.meal__head{display:grid;grid-template-columns:44px minmax(0,1fr) 44px;align-items:center;gap:10px;min-height:60px}
.ico{display:grid;place-items:center;width:44px;height:44px;border-radius:14px;background:var(--fill);font-size:24px;line-height:1}
.meal__head h2{font-size:19px;font-weight:800}
.meal__head p{color:var(--text2);font-size:14px}
.plus{width:44px;height:44px;border:0;border-radius:50%;background:var(--pri);color:var(--pri-ink);display:grid;place-items:center}
.plus svg{width:20px;height:20px}
.food{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:8px;min-height:58px;border-top:1px solid var(--sep)}
.food__main{display:grid;grid-template-columns:36px minmax(0,1fr);align-items:center;gap:10px;min-height:56px;padding:0;border:0;background:none;text-align:left;font-size:17px}
.food__main .emo{font-size:26px;line-height:1;text-align:center}
.food__main b{display:block;font-weight:700;overflow-wrap:anywhere}
.food__main small{display:block;color:var(--text2);font-size:13px}
.qty{display:inline-grid;grid-template-columns:34px auto 34px;align-items:center;border-radius:999px;background:var(--fill)}
.qty button{height:38px;border:0;background:none;font-size:15px;font-weight:800}
.qty button svg{width:14px;height:14px;display:block;margin:0 auto}
.qty__v{min-width:52px;padding:0 2px}
.empty{padding:10px 0 6px;border-top:1px solid var(--sep);color:var(--text2);font-size:15px}

/* consigli e pulsanti */
.sect{margin-top:22px}
.sect__head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:0 4px 8px}
.sect__head h2{font-size:20px;font-weight:800}
.sect__head span{color:var(--text2);font-size:14px}
.card{border-radius:22px;background:var(--card);padding:4px 14px}
.coach{padding:14px}
.coach__msg{font-weight:700}
.coach__sub{margin-top:4px;color:var(--text2);font-size:15px}
.sugg{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:10px;margin-top:10px;padding-top:10px;border-top:1px solid var(--sep)}
.sugg b{display:block;font-weight:700}
.sugg small{display:block;margin-top:2px;color:var(--text2);font-size:14px}
.pill{min-height:38px;padding:0 16px;border:0;border-radius:999px;background:var(--pri);color:var(--pri-ink);font-size:15px;font-weight:700}
.pill[disabled]{background:var(--fill);color:var(--text2);cursor:default}
.pill--soft{background:var(--pri-soft);color:var(--pri)}
.pill--plain{background:var(--fill);color:var(--text)}
.pill--wide{width:100%;min-height:48px;font-size:17px}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.lead{margin-top:10px;padding:0 4px;color:var(--text2);font-size:15px}

/* settimana */
.day{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:2px 10px;align-items:center;width:100%;min-height:74px;padding:10px 0;border:0;border-bottom:1px solid var(--sep);background:none;font-size:17px;text-align:left}
.day .ico{grid-row:1 / span 2}
.day__name{font-weight:800}
.day__type{color:var(--text2);font-size:14px;font-weight:700}
.day__prev{grid-column:2 / -1;color:var(--text2);font-size:14px}
.day__kcal{text-align:right;font-size:13px;color:var(--text2)}
.day__kcal b{display:block;color:var(--text);font-size:16px}
.card > :last-child{border-bottom:0}
.buy{display:grid;grid-template-columns:28px 30px minmax(0,1fr) auto;align-items:center;gap:8px;min-height:52px;border-bottom:1px solid var(--sep)}
.buy input{width:22px;height:22px;accent-color:var(--pri)}
.buy .emo{font-size:22px}
.buy span:last-child{color:var(--text2)}
.buy:has(input:checked) span:not(.emo){text-decoration:line-through;color:var(--text2)}

/* sfide */
.big{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:14px;margin-top:14px;padding:18px;border-radius:26px;background:var(--card)}
.big__n{display:flex;align-items:center;gap:6px;font-size:52px;font-weight:800;line-height:1;letter-spacing:-0.02em}
.big__n .emo{font-size:44px}
.big b{display:block;font-size:19px;font-weight:800}
.big p{margin-top:2px;color:var(--text2);font-size:15px}
.ch{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--sep)}
.ch b{font-weight:800}
.ch small{display:block;color:var(--text2);font-size:14px}
.ch__n{font-weight:800;color:var(--text2)}
.ch.done .ch__n{color:var(--ok)}
.dots{grid-column:2 / -1;display:flex;gap:6px;margin-top:4px}
.dots i{flex:1;max-width:44px;height:8px;border-radius:4px;background:var(--fill2)}
.dots i.on{background:var(--pri)}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.badge{display:grid;justify-items:center;gap:6px;padding:14px 6px 12px;border-radius:20px;background:var(--card);text-align:center;font-size:13px;font-weight:700}
.badge .emo{display:grid;place-items:center;width:56px;height:56px;border-radius:50%;background:var(--pri-soft);font-size:30px}
.badge small{color:var(--text2);font-size:12px;font-weight:600}
.badge.locked .emo{background:var(--fill);filter:grayscale(1);opacity:.45}
.badge.locked{color:var(--text2)}

/* chat */
.chat{display:grid;gap:10px;margin-top:14px}
.msg{max-width:88%;padding:10px 14px;border-radius:20px;white-space:pre-line}
.msg--bot{justify-self:start;background:var(--card);border-bottom-left-radius:6px}
.msg--me{justify-self:end;background:var(--pri);color:var(--pri-ink);border-bottom-right-radius:6px}
.typing{color:var(--text2)}
.chips{display:flex;gap:8px;margin:14px -16px 0;padding:0 16px 2px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;max-width:260px;min-height:40px;padding:6px 14px;border:0;border-radius:999px;background:var(--card);font-size:15px;text-align:left}
.composer{position:fixed;left:0;right:0;bottom:calc(88px + env(safe-area-inset-bottom,0px));z-index:19;display:flex;justify-content:center;padding:0 16px;pointer-events:none}
.composer__in{pointer-events:auto;display:flex;align-items:center;gap:8px;width:100%;max-width:528px;padding:6px 6px 6px 16px;border-radius:26px;background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--glass-line);box-shadow:var(--glass-shadow)}
.composer input{flex:1;min-width:0;height:40px;border:0;background:none;color:var(--text);font-size:17px;outline:none}
.composer input::placeholder,.field::placeholder{color:var(--text2)}
.send{width:40px;height:40px;border:0;border-radius:50%;background:var(--pri);color:var(--pri-ink);display:grid;place-items:center}
.send svg{width:18px;height:18px}
main.has-composer{padding-bottom:196px}

/* dock a vetro */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;padding:0 14px calc(10px + env(safe-area-inset-bottom,0px));pointer-events:none}
.dock__in{pointer-events:auto;display:grid;grid-template-columns:repeat(4,1fr);gap:2px;width:100%;max-width:380px;padding:6px;border-radius:34px;background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--glass-line);box-shadow:var(--glass-shadow)}
.dock a{display:grid;justify-items:center;gap:2px;padding:8px 2px 6px;border-radius:28px;color:var(--text2);font-size:11px;font-weight:700;text-decoration:none}
.dock a svg{width:24px;height:24px}
.dock a[aria-current="page"]{background:var(--pri-soft);color:var(--pri)}

/* pannello dal basso */
dialog.sheet{position:fixed;inset:auto 0 0 0;width:100%;max-width:560px;max-height:88%;margin:0 auto;padding:0;border:0;border-radius:26px 26px 0 0;background:var(--bg);color:var(--text);overflow:auto;overscroll-behavior:contain}
dialog.sheet:not([open]){display:none}
dialog::backdrop{background:rgba(10,8,30,.45)}
.sheet__head{position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px 10px;background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
.sheet__head h2{font-size:20px;font-weight:800}
.sheet__head h2:focus{outline:none}
.textbtn{min-height:44px;padding:0 4px;border:0;background:none;color:var(--pri);font-size:17px;font-weight:800}
.sheet__body{padding:6px 16px calc(26px + env(safe-area-inset-bottom,0px))}
.field{display:block;width:100%;height:52px;padding:0 16px;border:2px solid transparent;border-radius:16px;background:var(--card);color:var(--text);font-size:17px;-webkit-appearance:none;appearance:none}
.field:focus{border-color:var(--pri);outline:none}
.hint{margin-top:8px;padding:0 4px;color:var(--text2);font-size:14px}
.sub{margin:18px 4px 8px;font-size:15px;font-weight:800;color:var(--text2)}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.quick button{display:grid;justify-items:center;gap:4px;min-height:76px;padding:10px 4px 8px;border:2px solid transparent;border-radius:18px;background:var(--card);font-size:12px;font-weight:700;line-height:1.15;text-align:center}
.quick button .emo{font-size:28px;line-height:1}
.quick button.on{border-color:var(--pri);background:var(--pri-soft)}
.pick{display:grid;grid-template-columns:36px minmax(0,1fr) auto;align-items:center;gap:10px;width:100%;min-height:56px;border:0;border-bottom:1px solid var(--sep);background:none;font-size:17px;text-align:left}
.pick .emo{font-size:24px;text-align:center}
.pick small{display:block;color:var(--text2);font-size:13px}
.pick > span:last-child{color:var(--pri);font-size:14px;font-weight:800}
.amount{display:grid;grid-template-columns:56px 1fr 56px;align-items:center;gap:10px;margin-top:8px}
.amount button{width:56px;height:56px;border:0;border-radius:50%;background:var(--card);display:grid;place-items:center}
.amount button svg{width:22px;height:22px}
.amount__n{text-align:center;font-size:44px;font-weight:800;letter-spacing:-0.02em;line-height:1}
.amount__n small{font-size:20px;color:var(--text2)}
input[type="range"]{width:100%;margin:16px 0 4px;accent-color:var(--pri)}
.impact{margin-top:12px;padding:12px 14px;border-radius:16px;background:var(--card);font-size:15px}
.impact b{font-weight:800}
.looks{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.looks button{display:grid;justify-items:center;gap:8px;padding:14px 4px;border:2px solid transparent;border-radius:18px;background:var(--card);font-size:14px;font-weight:700}
.looks button i{width:36px;height:36px;border-radius:50%}
.looks button[aria-pressed="true"]{border-color:var(--pri)}

@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}
</style>
</head>
<body>

<main id="main"><div id="view"></div></main>

<div class="composer" id="composer" hidden>
  <div class="composer__in">
    <label class="vh" for="chatInput">Scrivi all’assistente</label>
    <input id="chatInput" type="text" autocomplete="off" enterkeyhint="send" placeholder="Scrivi gli impegni o una domanda">
    <button type="button" class="send" id="chatSend" aria-label="Invia"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
  </div>
</div>

<nav class="dock" aria-label="Sezioni">
  <div class="dock__in">
    <a href="#oggi" data-tab="oggi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 13a8 8 0 0 1 16 0"/><path d="M3 17h18M12 13l3.5-3.5"/></svg>Giornata</a>
    <a href="#sfide" data-tab="sfide"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 4h8v5a4 4 0 0 1-8 0z"/><path d="M8 6H5a3 3 0 0 0 3 4M16 6h3a3 3 0 0 1-3 4M12 13v4M8.5 20h7M10 17h4"/></svg>Sfide</a>
    <a href="#assistente" data-tab="assistente"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a7.5 7.5 0 0 1-11 6.6L4 20l1.4-4.6A7.5 7.5 0 1 1 20 12z"/></svg>Assistente</a>

const DEFAULT_PLAN = ['palestra', 'apnea', 'palestra', 'riposo', 'palestra', 'riposo', 'riposo'];
const STREAK_BASE = 3;

/* ---------- utilità ---------- */
const $ = (s, r) => (r || document).querySelector(s);
const uid = () => 'e' + Math.random().toString(36).slice(2, 9);
const fmt0 = (n) => Math.round(n).toLocaleString('it-IT');
const fmt1 = (n) => (Math.round(n * 10) / 10).toLocaleString('it-IT', { maximumFractionDigits: 1 });
const signed = (n) => (n > 0 ? '+' : n < 0 ? '−' : '') + fmt0(Math.abs(n));
const lc = (s) => s.charAt(0).toLowerCase() + s.slice(1);

function h(tag, props, ...kids) {

const emo = (e) => h('span', { class: 'emo', 'aria-hidden': 'true', text: e });
function icon(name) {

/* ---------- date ---------- */
const keyOf = (d) => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const dateOf = (k) => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d, 12); };
const shiftKey = (k, n) => { const d = dateOf(k); d.setDate(d.getDate() + n); return keyOf(d); };
const todayKey = () => keyOf(new Date());
const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);
const weekdayName = (k) => cap(new Intl.DateTimeFormat('it-IT', { weekday: 'long' }).format(dateOf(k)));
const dayMonth = (k) => new Intl.DateTimeFormat('it-IT', { day: 'numeric', month: 'long' }).format(dateOf(k));
function mondayOf(k) { const d = dateOf(k); d.setDate(d.getDate() - (d.getDay() + 6) % 7); return keyOf(d); }

/* ---------- calcoli ---------- */
const ZERO = () => ({ kcal: 0, p: 0, c: 0, f: 0, fib: 0 });
const scale = (food, g) => { const o = ZERO(); for (const m of MACROS) o[m.key] = FOODS[food][m.key] * g / 100; return o; };
function sum(list) { const out = ZERO(); for (const e of list) { const x = scale(e.food, e.g); for (const m of MACROS) out[m.key] += x[m.key]; } return out; }
const allEntries = (day) => MEALS.flatMap(([k]) => day.meals[k]);
const totals = (day) => sum(allEntries(day));
const tolOf = (m, tgt) => tgt[m.key] * (m.key === 'kcal' ? 0.04 : 0.08);
function errorOf(tot, tgt) { let e = 0; for (const m of MACROS) { const r = (tot[m.key] - tgt[m.key]) / tgt[m.key]; e += m.w * r * r; } return e; }
const stepOf = (food) => (FOODS[food].portion >= 60 ? 10 : 5);
function balance(day) {
  const tgt = TARGETS[day.type];
  const base = new Map(allEntries(day).map((e) => [e.id, e.g]));
  for (let i = 0; i < 80; i++) {
    const tot = totals(day); const cur = errorOf(tot, tgt); let best = null;
    for (const e of allEntries(day)) for (const dir of [1, -1]) {
      const g = e.g + dir * stepOf(e.food); const b = base.get(e.id);
      if (g < b * 0.5 || g > b * 2 || g <= 0) continue;
      const d = scale(e.food, g - e.g); const t = { ...tot };
      for (const m of MACROS) t[m.key] += d[m.key];
      const err = errorOf(t, tgt);
      if (err < cur - 1e-6 && (!best || err < best.err)) best = { e, g, err };

}
function buildDay(type, busy, variant) {
  const tpl = TEMPLATES[type][variant % 2]; const meals = {};
  for (const [k] of MEALS) meals[k] = (k === 'cena' && busy ? QUICK[variant % 2] : tpl[k]).map(([food, g]) => ({ id: uid(), food, g }));
  return balance({ type, busy: !!busy, meals });
}

/* ---------- stato ---------- */
const state = { date: todayKey(), days: {}, week: [], weekTab: 'piano', bought: {}, chat: [] };
function buildWeek(plan, busy) {
  const mon = mondayOf(todayKey()); state.week = [];
  for (let i = 0; i < 7; i++) { const k = shiftKey(mon, i); state.week.push(k); state.days[k] = buildDay(plan[i], busy && busy[i], i); }
  state.bought = {};
  if (!state.week.includes(state.date)) state.date = todayKey();
}
const getDay = (k) => state.days[k] || (state.days[k] = buildDay('riposo', false, 0));
function statusOf(k) {
  const day = getDay(k); const tot = totals(day); const tgt = TARGETS[day.type];
  const ok = MACROS.slice(0, 4).filter((m) => Math.abs(tot[m.key] - tgt[m.key]) <= tolOf(m, tgt)).length;

}

}

/* ---------- consigli (regole semplici, senza AI) ---------- */
function advise(dayKey) {
  const { day, tot, tgt } = statusOf(dayKey);
  const under = []; const over = [];
  for (const m of MACROS.slice(0, 4)) {
    const d = tot[m.key] - tgt[m.key];
    if (d < -tolOf(m, tgt)) under.push(fmt0(-d) + ' ' + m.long); else if (d > tolOf(m, tgt)) over.push(fmt0(d) + ' ' + m.long);
  }
  if (!under.length && !over.length) return { ok: true, text: 'Giornata perfetta: sei in linea con tutti gli obiettivi.', sub: 'Se cambi una quantità, qui trovi subito come rimediare.', list: [] };
  const text = [under.length ? 'Ti mancano ' + andJoin(under) : '', over.length ? (under.length ? 'e sei oltre di ' : 'Sei oltre di ') + andJoin(over) : ''].filter(Boolean).join(' ') + '.';
  const cur = errorOf(tot, tgt); const cands = [];
  const tryAct = (act, delta) => {
    const t = { ...tot }; for (const m of MACROS) t[m.key] += delta[m.key];
    const err = errorOf(t, tgt); if (err < cur * 0.93) cands.push({ ...act, err, delta });
  };
  for (const [mk, , where] of MEALS) for (const e of day.meals[mk]) {
    const st = stepOf(e.food);
    for (const mult of [1.25, 1.5, 0.75, 0.5]) {
      const g = Math.max(st, Math.round(e.g * mult / st) * st);
      if (g === e.g) continue;
      tryAct({ kind: g > e.g ? 'inc' : 'dec', dayKey, meal: mk, entry: e.id, food: e.food, g, title: (g > e.g ? 'Più ' : 'Meno ') + lc(FOODS[e.food].name) + ' ' + where, detail: 'da ' + fmt0(e.g) + ' a ' + fmt0(g) + ' g' }, scale(e.food, g - e.g));
    }
  }
  const present = new Set(allEntries(day).map((e) => e.food));
  for (const id of Object.keys(FOODS)) {
    if (present.has(id)) continue;
    const g = FOODS[id].portion;
    tryAct({ kind: 'add', dayKey, meal: 'spuntini', food: id, g, title: 'Aggiungi ' + lc(FOODS[id].name) + ' negli spuntini', detail: fmt0(g) + ' g' }, scale(id, g));
  }

  const list = []; const seen = new Set();
  for (const c of cands) {
    if (seen.has(c.food) || (c.kind === 'add' && list.some((x) => x.kind === 'add'))) continue;
    seen.add(c.food); list.push(c); if (list.length === 3) break;
  }

}
function applySugg(s) {

/* ---------- capire una frase: «150 g di riso e 2 uova» ---------- */
const NUMW = { un: 1, uno: 1, una: 1, due: 2, tre: 3, quattro: 4, cinque: 5, mezzo: 0.5, mezza: 0.5 };
function parseFoods(text) {
  const chunks = (' ' + norm(text).replace(/['’]/g, ' ') + ' ').split(/,|\+|;| e | con | piu /).map((s) => s.trim()).filter(Boolean);
  const out = [];
  for (const ch of chunks) {
    let best = null;
    for (const [id, f] of Object.entries(FOODS)) for (const kw of f.kw) {
      if (new RegExp('\\b' + kw + '\\b').test(ch) && (!best || kw.length > best.kw.length)) best = { id, kw };
    }
    if (!best) continue;
    const f = FOODS[best.id]; let g = f.portion;
    const m = ch.match(/(\d+(?:[.,]\d+)?)\s*(kg|chili|etti|etto|hg|grammi|gr|g)?\b/);
    if (m) {
      const n = parseFloat(m[1].replace(',', '.')); const u = m[2];
      if (u === 'kg' || u === 'chili') g = n * 1000; else if (u === 'etti' || u === 'etto' || u === 'hg') g = n * 100;
      else if (u || n >= 20) g = n; else g = n * (f.unit || f.portion);
    } else {
      const w = ch.split(/\s+/).find((x) => NUMW[x] != null);
      if (w) g = NUMW[w] * (f.unit || f.portion);
    }
    if (g > 0) out.push({ food: best.id, g: Math.round(g) });
  }
  return out;
}
function swapsFor(e) {
  const f = FOODS[e.food];
  const key = f.cat === 'carb' || f.cat === 'fruit' ? 'c' : f.cat === 'pro' ? 'p' : f.cat === 'fat' ? 'f' : 'kcal';
  const amount = f[key] * e.g / 100;
  const label = { c: 'Stessi carboidrati', p: 'Stesse proteine', f: 'Stessi grassi', kcal: 'Stesse calorie' }[key];
  const list = Object.entries(FOODS).filter(([id, x]) => id !== e.food && x.cat === f.cat && x[key] > 0)
    .map(([id, x]) => { const st = stepOf(id); return { id, g: Math.max(st, Math.round(amount / x[key] * 100 / st) * st) }; }).slice(0, 4);
  return { label, list };
}

/* ---------- navigazione ---------- */
const VIEWS = ['oggi', 'sfide', 'assistente', 'settimana'];

/* ---------- giornata ---------- */
function viewDay() {

      h('span', { text: weekdayName(k).charAt(0) }), h('span', { class: 'sd__n', text: String(dateOf(k).getDate()) })));
  }

  const gauge = h('div', { class: 'gauge', id: 'gauge' });
  gauge.innerHTML = '<svg viewBox="0 0 220 122" aria-hidden="true"><path class="g-bg" d="M20 110 A90 90 0 0 1 200 110" pathLength="100"/><path class="g-fg" id="gfg" d="M20 110 A90 90 0 0 1 200 110" pathLength="100" stroke-dasharray="0 100"/></svg>';
  gauge.append(h('div', { class: 'gauge__mid' }, h('div', { class: 'gauge__n', id: 'gn' }), h('div', { class: 'gauge__l', id: 'gl' })));
  const seg = h('div', { class: 'seg', role: 'radiogroup', 'aria-label': 'Tipo di giornata' });

/* ---------- assistente (in questa prova risponde con regole semplici, non con l’AI) ---------- */
const DAY_WORDS = [['lunedi', 'lun'], ['martedi', 'mar'], ['mercoledi', 'mer'], ['giovedi', 'gio'], ['venerdi', 'ven'], ['sabato', 'sab'], ['domenica', 'dom']];
const ACT_WORDS = [['palestra', /palestra|allenament|pesi\b|gym/], ['apnea', /apnea|piscina/], ['riposo', /riposo/], ['busy', /cena fuori|fuori a cena|fuori\b|impegn|aperitivo|torno tardi|faccio tardi|ospiti/]];
function parsePlan(text) {
  const t = norm(text); const toks = [];
  DAY_WORDS.forEach(([long, short], i) => { const re = new RegExp('\\b(' + long + '|' + short + ')\\b', 'g'); let m; while ((m = re.exec(t))) toks.push({ at: m.index, day: i }); });
  if (!toks.length) return null;
  for (const [act, re] of ACT_WORDS) { const g = new RegExp(re.source, 'g'); let m; while ((m = g.exec(t))) toks.push({ at: m.index, act }); }
  toks.sort((a, b) => a.at - b.at);
  if (!toks.some((x) => x.act)) return null;
  const plan = Array(7).fill('riposo'); const busy = Array(7).fill(false);
  const give = (d, act) => { if (act === 'busy') busy[d] = true; else plan[d] = act; };
  const dayFirst = toks[0].day != null;
  toks.forEach((tk, i) => {
    if (tk.day == null) return;
    const next = toks[i + 1]; const after = toks[i + 2];
    if (dayFirst || (next && next.act && (!after || after.act))) { for (let j = i + 1; j < toks.length && toks[j].act; j++) give(tk.day, toks[j].act); return; }
    for (let j = i - 1; j >= 0; j--) if (toks[j].act) { give(tk.day, toks[j].act); break; }
  });
  return { plan, busy };
}
const say = (msg) => state.chat.push(msg);
function answer(text) {
  const t = norm(text); const parsed = parsePlan(text);
  if (parsed) {
    buildWeek(parsed.plan, parsed.busy);
    const lines = state.week.map((k, i) => { const ty = TYPES.find((x) => x[0] === parsed.plan[i]); return ty[2] + ' ' + weekdayName(k) + ': ' + ty[1] + (parsed.busy[i] ? ', cena veloce' : ''); });
    return { text: 'Fatto, ho rifatto il piano della settimana con gli obiettivi di ogni giornata.\n\n' + lines.join('\n'), acts: [['Apri la settimana', () => { state.weekTab = 'piano'; go('settimana'); }], ['Lista della spesa', () => { state.weekTab = 'spesa'; go('settimana'); }]] };
  }
  if (/veloc|rapid|poco tempo/.test(t) && /cena|stasera/.test(t)) {
    const k = todayKey(); const day = getDay(k);
    day.busy = true; day.meals.cena = QUICK[dateOf(k).getDate() % 2].map(([food, g]) => ({ id: uid(), food, g }));
    return { text: '⚡ Ho sostituito la cena di oggi con una versione da dieci minuti: ' + day.meals.cena.map((e) => lc(FOODS[e.food].name)).join(', ') + '.', acts: [['Apri la giornata', () => { state.date = k; go('oggi'); }]] };
  }
  if (/manc|sotto|sfor|oltre|consigl|macro|target|obiettiv/.test(t)) { const a = advise(state.date); return { text: a.text + (a.sub ? '\n' + a.sub : ''), sugg: a.list }; }
  return { text: 'In questa prova rispondo a tre cose: gli impegni della settimana, i consigli sui macro e la cena veloce. Nell’app vera qui risponde l’AI, quindi potrai chiedere qualsiasi cosa.' };
}
function send(text) {
  const v = String(text || '').trim(); if (!v) return;
  say({ me: true, text: v }); const wait = { typing: true }; say(wait); render();
  setTimeout(() => { const i = state.chat.indexOf(wait); if (i >= 0) state.chat.splice(i, 1, answer(v)); if (current() === 'assistente') render(); }, 500);
}
function toBottom() { try { window.scrollTo(0, document.documentElement.scrollHeight); } catch (e) { /* senza scorrimento */ } }
function viewChat() {
  const root = h('div');
  root.append(h('header', { class: 'top' }, h('div', null, h('h1', { text: 'Assistente' }), h('p', { text: 'Prepara il piano e ti aiuta a chiudere i macro' }))));
  const list = h('div', { class: 'chat', role: 'log', 'aria-live': 'polite' });
  for (const m of state.chat) {
    if (m.typing) { list.append(h('div', { class: 'msg msg--bot typing', text: 'Sto pensando…' })); continue; }
    const node = h('div', { class: 'msg ' + (m.me ? 'msg--me' : 'msg--bot'), text: m.text });
    if (m.sugg) for (const s of m.sugg) node.append(suggNode(s));
    if (m.acts) node.append(h('div', { class: 'acts' }, m.acts.map(([label, fn]) => h('button', { type: 'button', class: 'pill pill--soft', onclick: fn }, label))));
    list.append(node);
  }
  const chips = h('div', { class: 'chips' });
  for (const ex of ['Palestra lunedì, mercoledì e venerdì, apnea martedì, giovedì sera sono fuori', 'Cosa mi manca oggi?', 'Stasera ho poco tempo, cena veloce']) chips.append(h('button', { type: 'button', onclick: () => send(ex) }, ex));
  root.append(list, chips);
  return root;
}
$('#chatSend').addEventListener('click', () => { const i = $('#chatInput'); send(i.value); i.value = ''; });
$('#chatInput').addEventListener('keydown', (ev) => { if (ev.key === 'Enter') { ev.preventDefault(); $('#chatSend').click(); } });

/* ---------- avvio ---------- */
buildWeek(DEFAULT_PLAN, null);
say({ text: 'Ciao. Dimmi gli impegni della settimana e preparo il piano, oppure chiedimi come chiudere i macro di oggi.\n\nPuoi scrivere o toccare uno degli esempi qui sotto.' });
window.addEventListener('hashchange', () => { render(); if (current() !== 'assistente') window.scrollTo(0, 0); });
render();
})();
</script>
